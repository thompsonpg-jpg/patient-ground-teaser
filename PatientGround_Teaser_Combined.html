awn);margin-top:.9rem;\n  }\n\n  /* ---------- choices ---------- */\n\n  #choices{margin-top:1.15rem;border-top:1px solid var(--hair)}\n\n  .pick{\n    display:block;width:100%;\n    background:none;border:0;\n    border-bottom:1px solid var(--hair);\n    color:var(--linen);\n    font-family:'EB Garamond',Georgia,serif;\n    font-size:1rem;text-align:left;\n    padding:.82rem .2rem .82rem 1.4rem;\n    position:relative;cursor:pointer;\n    text-shadow:0 1px 3px rgba(11,12,14,.95), 0 2px 14px rgba(11,12,14,.9);\n    transition:color .25s,padding-left .25s;\n  }\n  .pick::before{\n    content:'';position:absolute;left:0;top:50%;\n    width:0;height:1px;background:var(--dawn);\n    transition:width .25s ease;\n  }\n  .pick:hover,.pick:focus-visible{color:#fff;padding-left:1.8rem;outline:none}\n  .pick:hover::before,.pick:focus-visible::before{width:13px}\n\n  .pick.done{color:rgba(222,216,205,.36);cursor:default}\n  .pick.done::after{content:'\u00b7';margin-left:.5rem;color:var(--lichen)}\n\n  /* ---------- the hold ---------- */\n\n  #hold{\n    margin-top:1.15rem;\n    border:1px solid var(--hair);\n    padding:.95rem 1rem;text-align:center;\n    cursor:pointer;position:relative;overflow:hidden;\n    user-select:none;-webkit-user-select:none;\n    -webkit-tap-highlight-color:transparent;\n  }\n  #hold .fill{\n    position:absolute;inset:0;\n    background:rgba(196,134,127,.15);\n    transform:scaleX(0);transform-origin:left;\n    transition:transform .12s linear;\n  }\n  #hold .cap{\n    position:relative;\n    font-family:'Courier Prime',monospace;\n    font-size:.6rem;letter-spacing:.24em;\n    text-transform:uppercase;color:var(--linen);\n  }\n  #hold .beat{\n    position:relative;display:block;margin-top:.45rem;\n    font-family:'Courier Prime',monospace;\n    font-size:1.1rem;letter-spacing:.4em;\n    color:var(--dawn);min-height:1.3em;\n  }\n  #hold.let{border-color:rgba(196,134,127,.42)}\n  #hold.brim{border-color:rgba(196,134,127,.85)}\n  #hold.brim .cap{color:var(--dawn)}\n\n  /* ---------- the flex: press, hold, release right at the top ---------- */\n\n  #flex{\n    margin-top:1.15rem;\n    border:1px solid var(--hair);\n    padding:.95rem 1rem;text-align:center;\n    cursor:pointer;position:relative;overflow:hidden;\n    user-select:none;-webkit-user-select:none;\n    -webkit-tap-highlight-color:transparent;\n    transition:border-color .15s;\n  }\n  #flex .fill{\n    position:absolute;inset:0;\n    background:rgba(196,134,127,.16);\n    transform:scaleX(0);transform-origin:left;\n  }\n  #flex .cap{\n    position:relative;\n    font-family:'Courier Prime',monospace;\n    font-size:.6rem;letter-spacing:.24em;\n    text-transform:uppercase;color:var(--linen);\n  }\n  #flex .reps{\n    position:relative;display:block;margin-top:.3rem;\n    font-family:'Courier Prime',monospace;\n    font-size:.62rem;letter-spacing:.22em;\n    color:rgba(148,154,144,.75);\n  }\n  #flex .beat{\n    position:relative;display:block;margin-top:.5rem;\n    font-family:'Courier Prime',monospace;\n    font-size:1.05rem;letter-spacing:.15em;\n    color:var(--dawn);min-height:1.3em;\n  }\n  #flex.window{border-color:rgba(196,134,127,.85)}\n  #flex.window .fill{background:rgba(196,134,127,.32)}\n  #flex.window .cap{color:var(--dawn)}\n\n\n  /* ---------- the search: one guess, real rooms ---------- */\n\n  #searchcap{\n    font-family:'Courier Prime',monospace;\n    font-size:.6rem;letter-spacing:.2em;\n    text-transform:uppercase;\n    color:rgba(148,154,144,.75);\n    margin:.9rem 0 .3rem;\n  }\n\n  /* ---------- examine: attention as a lens ---------- */\n\n  #exam{\n    position:absolute;inset:0;\n    z-index:5;cursor:crosshair;\n    touch-action:none;\n    display:none;\n  }\n  #exam.on{display:block}\n\n  /* the picture stays at full brightness; the lens lifts what you look at */\n  #shade{\n    position:absolute;inset:0;\n    background:radial-gradient(circle 118px at var(--mx,-999px) var(--my,-999px),\n      rgba(255,255,255,.26) 0%,\n      rgba(255,255,255,.20) 42%,\n      rgba(255,255,255,.06) 66%,\n      rgba(255,255,255,0)   78%);\n    mix-blend-mode:screen;\n  }\n\n  #ring{\n    position:absolute;width:168px;height:168px;\n    left:var(--mx,-999px);top:var(--my,-999px);\n    transform:translate(-50%,-50%) scale(var(--rs,1));\n    border-radius:50%;\n    border:1px solid rgba(222,216,205,var(--ro,.16));\n    box-shadow:0 0 0 1px rgba(196,134,127,calc(var(--rw,0) * .5)) inset;\n    pointer-events:none;\n    transition:opacity .2s;\n  }\n  #ring.hot{border-color:rgba(196,134,127,.7)}\n\n  /* dwell indicator */\n  #dwell{\n    position:absolute;left:var(--mx,-999px);top:var(--my,-999px);\n    width:40px;height:40px;\n    transform:translate(-50%,-50%);\n    border-radius:50%;\n    background:conic-gradient(rgba(196,134,127,.85) calc(var(--dw,0) * 1turn),\n      transparent 0);\n    -webkit-mask-image:radial-gradient(circle, transparent 62%, #000 64%);\n    mask-image:radial-gradient(circle, transparent 62%, #000 64%);\n    opacity:var(--dwo,0);\n    pointer-events:none;\n  }\n\n  .pin{\n    position:absolute;width:9px;height:9px;\n    transform:translate(-50%,-50%);\n    border-radius:50%;\n    border:1px solid rgba(222,216,205,.5);\n    background:rgba(196,134,127,.35);\n    pointer-events:none;\n  }\n  .pin.faint{\n    border-color:rgba(222,216,205,.22);\n    background:none;\n    animation:breathe 2.6s ease-in-out infinite;\n  }\n  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}\n\n  #examcap{\n    position:absolute;left:0;right:0;top:1rem;\n    text-align:center;\n    pointer-events:none;\n  }\n  #examcap span{\n    display:inline-block;\n    padding:.44rem .85rem;\n    background:rgba(14,16,19,.66);\n    -webkit-backdrop-filter:blur(4px);\n    backdrop-filter:blur(4px);\n    border:1px solid rgba(222,216,205,.16);\n    font-family:'Courier Prime',monospace;\n    font-size:.62rem;letter-spacing:.2em;\n    text-transform:uppercase;\n    color:#f0eade;\n  }\n  #examcap:empty{display:none}\n\n  #examclock{\n    position:absolute;left:0;right:0;top:2.85rem;\n    text-align:center;pointer-events:none;\n  }\n  #examclock span{\n    display:inline-block;\n    padding:.3rem .7rem;\n    background:rgba(14,16,19,.66);\n    -webkit-backdrop-filter:blur(4px);\n    backdrop-filter:blur(4px);\n    border:1px solid rgba(222,216,205,.14);\n    font-family:'Courier Prime',monospace;\n    font-size:.6rem;letter-spacing:.18em;\n    color:rgba(240,234,222,.72);\n  }\n  #examclock:empty{display:none}\n\n  #namebtn{\n    display:block;width:100%;background:none;border:0;\n    margin-top:.55rem;\n    font-family:'Courier Prime',monospace;\n    font-size:.56rem;letter-spacing:.18em;\n    text-transform:uppercase;color:rgba(148,154,144,.65);\n    cursor:pointer;text-align:center;\n    opacity:0;pointer-events:none;\n    transition:opacity .6s;\n  }\n  #namebtn.show{opacity:1;pointer-events:auto}\n  #namebtn:hover,#namebtn:focus-visible{color:var(--linen);opacity:1;pointer-events:auto}\n\n  /* ---------- flash ---------- */\n\n  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}\n\n  #savebtn{\n    position:absolute;top:.7rem;right:.7rem;z-index:20;\n    background:rgba(14,16,19,.66);\n    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);\n    border:1px solid rgba(222,216,205,.22);\n    color:var(--linen);\n    font-family:'Courier Prime',monospace;\n    font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;\n    padding:.4rem .65rem;cursor:pointer;\n    transition:border-color .3s,opacity .3s;\n  }\n  #savebtn:hover,#savebtn:focus-visible{border-color:var(--dawn);outline:none}\n  #flash.go{animation:blank 1.6s cubic-bezier(.16,.7,.3,1)}\n  /* hard onset, slow reluctant decay, two involuntary aftershocks in the tail */\n  @keyframes blank{\n    0%   {opacity:0}\n    3%   {opacity:1}\n    18%  {opacity:.97}\n    34%  {opacity:.58}\n    44%  {opacity:.74}\n    60%  {opacity:.24}\n    68%  {opacity:.38}\n    84%  {opacity:.07}\n    100% {opacity:0}\n  }\n\n  /* on flash scenes the prose arrives as the white lets go */\n  #prose.after-flash{animation:surface 1.1s ease-out .55s backwards}\n  @keyframes surface{from{opacity:0}to{opacity:1}}\n\n  /* ---------- cards ---------- */\n\n  .card{\n    position:absolute;inset:0;z-index:40;\n    background:var(--ink);\n    display:flex;flex-direction:column;\n    align-items:center;justify-content:center;\n    text-align:center;padding:2rem 1.7rem;gap:1rem;\n  }\n  .card.gone{display:none}\n  .card .eyebrow{\n    font-family:'Courier Prime',monospace;\n    font-size:.7rem;letter-spacing:.2em;\n    text-transform:uppercase;\n    color:var(--dawn);\n    max-width:30ch;line-height:1.6;\n  }\n  .card h1{font-weight:400;font-size:2rem;line-height:1.16}\n  .card h2{font-weight:400;font-size:1.26rem}\n  .card .thin{width:44px;height:1px;background:var(--hair)}\n  .card p{\n    font-size:.98rem;line-height:1.58;\n    color:rgba(222,216,205,.74);max-width:31ch;\n  }\n  .card .go{\n    margin-top:.5rem;background:none;\n    border:1px solid var(--hair);color:var(--linen);\n    font-family:'Courier Prime',monospace;\n    font-size:.62rem;letter-spacing:.24em;\n    text-transform:uppercase;\n    padding:.75rem 1.4rem;cursor:pointer;\n    transition:border-color .3s,color .3s;\n  }\n  .card .go:hover,.card .go:focus-visible{border-color:var(--dawn);color:#fff;outline:none}\n\n  .card .go.buy{\n    background:var(--dawn);border-color:var(--dawn);color:var(--ink);\n    font-weight:700;\n  }\n  .card .go.buy:hover,.card .go.buy:focus-visible{\n    background:#d6968f;border-color:#d6968f;color:var(--ink);\n  }\n  .card .again-link{\n    margin-top:.2rem;background:none;border:0;\n    font-family:'Courier Prime',monospace;\n    font-size:.6rem;letter-spacing:.18em;\n    text-transform:uppercase;\n    color:rgba(148,154,144,.65);\n    cursor:pointer;text-decoration:none;\n    transition:color .3s;\n  }\n  .card .again-link:hover,.card .again-link:focus-visible{color:var(--linen);outline:none}\n  .card .cost{\n    font-size:.95rem;line-height:1.62;\n    color:rgba(222,216,205,.6);\n    max-width:33ch;\n  }\n  .card .foot{\n    font-family:'Courier Prime',monospace;\n    font-size:.55rem;letter-spacing:.14em;\n    color:rgba(148,154,144,.55);\n    line-height:1.7;max-width:34ch;\n  }\n\n  @media (prefers-reduced-motion:reduce){\n    *{transition-duration:.01ms !important;animation-duration:.01ms !important}\n  }\n</style>\n</head>\n<body>\n\n<div id=\"stage\">\n\n  <img id=\"art\" alt=\"\">\n\n  <div id=\"holder\">\n    <span class=\"mark\" id=\"hmark\"></span>\n    <span class=\"rule\"></span>\n    <span class=\"file\" id=\"hfile\"></span>\n  </div>\n\n  <div id=\"veil\"></div>\n\n  <div id=\"exam\">\n    <div id=\"shade\"></div>\n    <div id=\"ring\"></div>\n    <div id=\"dwell\"></div>\n    <div id=\"examcap\"><span></span></div>\n    <div id=\"examclock\"></div>\n  </div>\n\n  <div id=\"script\">\n    <div id=\"label\"></div>\n    <div id=\"prose\"></div>\n    <div id=\"choices\"></div>\n  </div>\n\n  <button id=\"savebtn\" type=\"button\">Save</button>\n\n  <div id=\"flash\"></div>\n\n  <div class=\"card\" id=\"open\">\n    <span class=\"eyebrow\">An interactive companion</span>\n    <h1>The Patient Ground</h1>\n    <span class=\"thin\"></span>\n    <h2>Chapter Two \u2014 The Abbey</h2>\n    <p>Abbaye de Valloires, spring 1941. Twenty-one days in a room with white walls, and one afternoon when the walls almost aren't enough.</p>\n    <button class=\"go\" id=\"begin\">Begin</button>\n    <button class=\"again-link gone\" id=\"resume\">Resume where you left off</button>\n    <span class=\"foot\">Prototype. Chapter two only.</span>\n  </div>\n\n  <div class=\"card gone\" id=\"taken\">\n    <span class=\"eyebrow\">Taken</span>\n    <h2>The door opened.</h2>\n    <span class=\"thin\"></span>\n    <p id=\"takennote\"></p>\n    <span class=\"thin\"></span>\n    <p class=\"cost\" id=\"takencost\"></p>\n    <button class=\"go\" id=\"retry\">Again</button>\n    <span class=\"foot\">Th\u00e9r\u00e8se had known the risk since the morning she took him in.</span>\n  </div>\n\n  <div class=\"card gone\" id=\"close\">\n    <span class=\"eyebrow\">End of chapter two</span>\n    <h2>The pear tree, through the van doors.</h2>\n    <span class=\"thin\"></span>\n    <p id=\"endnote\"></p>\n    <a class=\"go\" href=\"#\" id=\"nextChapterLink\">Play Chapter Three \u2192</a>\n    <a class=\"go buy\" href=\"https://mybook.to/ThePatientGround\" target=\"_blank\" rel=\"noopener\">Buy the Book</a>\n    <button class=\"again-link\" id=\"again\">Start Chapter Two again</button>\n    <span class=\"foot\">The Patient Ground \u2014 a novel by [Author Name]</span>\n  </div>\n\n</div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var art    = document.getElementById('art');\n  var holder = document.getElementById('holder');\n  var hmark  = document.getElementById('hmark');\n  var hfile  = document.getElementById('hfile');\n  var label  = document.getElementById('label');\n  var prose  = document.getElementById('prose');\n  var picks  = document.getElementById('choices');\n  var script = document.getElementById('script');\n  var flash  = document.getElementById('flash');\n  var openC  = document.getElementById('open');\n  var closeC = document.getElementById('close');\n\n  /* how carefully he's been paying attention \u2014 seeds the abbey mechanic */\n  var steady = 0;\n  var looked = {};\n  var spent  = {};   /* alternatives already exhausted, so they don't loop blind */\n  var examTimes = {}; /* how long each exam scene took \\u2014 lets a later scene react to how carefully he looked, or how fast he moved */\n  var currentScene = null;\n  var SAVE_KEY = 'tpg_save_ch2';\n\n  var scenes = {\n\n    arrival: {\n      art:'https://static.wixstatic.com/media/8e79ea_f4607ecd8588415d8c8ecd5a16f67b91~mv2.jpg', mark:'The abbey', label:'Late April 1941',\n      text:[\n        \"The van slowed through an orchard just coming into blossom, white and pink against a long pale-stone facade under steep dark roofs. A bell tower at the far end. A wooded hillside behind, holding the whole valley still.\",\n        \"Two hundred years old, someone said, though nobody was really talking to him. He had stopped being able to tell how much of what he heard was said to him and how much he was simply present for.\",\n        \"The man who had driven the cart from the ditch carried him in \\u2014 Jean-Baptiste, cur\\u00e9 of the parish and, David would learn only later, brother to the woman waiting in the doorway. He set David down inside with the same unhurried precision he'd brought to everything since Picardy, and then he was gone, back to the next task, back to the next child, without ceremony.\",\n        \"It looked like the kind of place nothing had ever happened to. That, he would learn, was the entire point of it.\"\n      ],\n      opts:[ { t:\"Let her look at him.\", go:'scissors' } ]\n    },\n\n    scissors: {\n      art:'https://static.wixstatic.com/media/8e79ea_3039a41c2be14faa8486f7c6ba368b9d~mv2.jpg', mark:'The kitchen scissors', label:'A whitewashed room',\n      text:[\n        \"She cut the jacket off him with ordinary kitchen scissors, working through scorched leather and fused sheepskin with the economy of someone who had decided, somewhere before he arrived, that economy was the only thing that would get this done.\",\n        \"He lay still and let his attention go where hers went.\"\n      ],\n      exam:{\n        cap:'Watch her work.',\n        require:['glove','pocket','sleeve','hands'],\n        spots:[\n          { k:'glove', x:50, y:72, r:11, mono:'the fused glove', worth:1, text:[\n            \"The glove had fused to the left hand somewhere over Picardy and had not come free since. She did not try to pull it away. She cut around it instead, patient, unhurried, leaving the fused mess for a moment when there would be time to do it properly.\",\n            \"No gore. Burns do not bleed. What came away came away in one piece, and she set the whole ruin of it aside on the cloth as if it were simply the next thing on a list.\"\n          ]},\n          { k:'pocket', x:14, y:45, r:12, mono:'the breast pocket', worth:1, text:[\n            \"The spark plug was still there, wrapped in brown paper, exactly where he'd put it three days and a lifetime ago. She found it with her fingers before she found it with her eyes, and set it aside on the cloth without asking what it was.\",\n            \"He did not have the words yet to tell her it mattered. It would be a while before he had the words for much of anything.\"\n          ]},\n          { k:'sleeve', x:30, y:60, r:10, mono:'the slit sleeve', worth:1, text:[\n            \"The sleeve had already been slit from cuff to shoulder before she ever touched it \\u2014 someone in the cart, or the boy, or the priest himself, had done at least this much already, somewhere on the road here.\",\n            \"He had no memory of it happening. There was a great deal, he was starting to understand, that had happened to him that he had no memory of.\"\n          ]},\n          { k:'hands', x:60, y:58, r:9, mono:'her hands', worth:1, text:[\n            \"Her own hands were calloused, short-nailed, entirely without hesitation. Whatever she had done before this morning, it had not been nursing exactly \\u2014 but it plainly involved doing difficult things quickly, and not remarking on them afterward.\",\n            \"She did not ask his name. She would give him hers before she asked for his \\u2014 Th\\u00e9r\\u00e8se \\u2014 because a name offered first costs the other person nothing to accept.\"\n          ]}\n        ]\n      },\n      next:{ t:'Let her finish.', go:'dressing' }\n    },\n\n    dressing: {\n      art:'https://static.wixstatic.com/media/8e79ea_6171b609e5e44d6682a4637577a76ddf~mv2.jpg', mark:'The dressing', label:'Finger by finger',\n      text:[\n        \"Each finger wrapped alone, held apart from its neighbours, so that healing would not weld one to the next the way the glove had welded to the skin.\",\n        \"He let his attention go where hers went.\"\n      ],\n      exam:{\n        cap:'Watch her hands.',\n        require:['wrapped','working','skin','basin'],\n        spots:[\n          { k:'wrapped', x:48, y:30, r:13, mono:'the finished fingers', worth:1, text:[\n            \"Two fingers already done \\u2014 spiralled base to tip in boiled white linen, the pink of the fingertip showing at the very top where the wrap stopped short on purpose.\",\n            \"Held apart from their neighbours, deliberately, so that healing would not weld one to the next the way the glove had welded to the skin.\"\n          ]},\n          { k:'working', x:62, y:55, r:13, mono:'the fingers still to do', worth:1, text:[\n            \"\\u2018Ils gu\\u00e9rissent coll\\u00e9s, sinon,\\u2019 she said. Otherwise they heal stuck together. She did not look up while she said it, and her hands did not slow down, and somehow both of those things made it easier to hear.\",\n            \"Two more fingers to go. She worked the linen round each one with the same unhurried precision she'd used on the jacket.\"\n          ]},\n          { k:'skin', x:32, y:58, r:12, mono:'the raw new skin', worth:1, text:[\n            \"Raw new skin showed pink at the edges of each spiral, tight and shining where the wrap didn't quite reach.\",\n            \"He watched her do all ten and could not have told her, then, which hurt more \\u2014 the burns, or watching someone else's calm attention to them.\"\n          ]},\n          { k:'basin', x:22, y:14, r:13, mono:'the basin, out of focus', worth:1, text:[\n            \"An enamel basin on the stone ledge behind her, blurred at the edge of what he could still bring into focus. Everything in the room that wasn't his hand had gone soft and far away.\",\n            \"He would spend three weeks in rooms very like this one, and remember almost none of the rooms themselves.\"\n          ]}\n        ]\n      },\n      next:{ t:'Let her finish.', go:'first-night' }\n    },\n\n    'first-night': {\n      art:'https://static.wixstatic.com/media/8e79ea_06604932e894404eaacf5db4e4a5d32c~mv2.jpg', mark:'The first night', label:'Near-total dark',\n      text:[\n        \"The shutters were closed against the blackout, and what came through the gap between them was a single blade of moonlight, too thin to show him the room.\",\n        \"He reached out, uncertainly, the way a man reaches for something he is no longer sure will answer to touch the way it used to.\"\n      ],\n      exam:{\n        cap:'Find something solid.',\n        require:['rail'],\n        spots:[\n          { k:'rail', x:74, y:58, r:18, mono:'the bed rail', worth:1, text:[\n            \"Cold iron, exactly where a bed rail ought to be. It answered his hand the way iron always had, the way it had before any of this, and for a moment that was the whole of what he knew about the world.\",\n            \"It was the smallest possible confirmation that the world was still built the way he remembered it. For one night, in a room this dark, it was enough.\"\n          ]}\n        ]\n      },\n      next:{ t:'Sleep, if it comes.', go:'leg-setting' }\n    },\n\n    /* -------- the second night : Dr Leclerc sets the bone --------\n       per the novel, not the design brief: the leg is plastered here, at\n       the abbey, on the second night \u2014 not later at the Manoir. A hold,\n       but with real texture: the count is what he has instead of the\n       morphia that \"was not enough for what came next,\" and how well he\n       holds it changes how the bone knits, not whether the scene ends. */\n    'leg-setting': {\n      art:'https://static.wixstatic.com/media/8e79ea_c9e09df67fe649609789c70b808dfe10~mv2.jpg', mark:'The second night', label:'By lamplight',\n      text:[\n        \"Th\\u00e9r\\u00e8se had sent for Dr Leclerc the moment he arrived \\u2014 the doctor who visited the preventorium every week to check the children, already trusted with more than the children knew. He gave David morphia first. It was not enough for what came next.\",\n        \"Leclerc's hands were steady on the displaced bone. Th\\u00e9r\\u00e8se held his shoulders down against the mattress and put a leather strap between his teeth and told him, once, to bite.\",\n        \"There was nothing to hold on to but the count. Five, and hold, the way she had already taught him to hold still for the dressings \\u2014 except this time the stillness was the only thing standing between a bone that healed straight and one that didn't.\"\n      ],\n      hold:{\n        need:6, gap:1700, settle:500, practice:true, retry:'leg-setting', bonus:2, penalty:1, go:'exercises',\n        cap:'Hold. Let him work.',\n        slowText:'The leg jerked under Leclerc\\u2019s hands before he\\u2019d finished the count, and his voice went flat and fast in a way it hadn\\u2019t been a moment before \\u2014 not angry, just working faster than was good for either of them.',\n        overText:'He held past where holding helped, rigid long after Leclerc had already finished, the strap clenched white between his teeth for no reason left to clench it for.'\n      }\n    },\n\n    /* -------- 2.4 : the exercises begin -------- five clean reps or he\n       does the set again. Retry, not jeopardy: nothing is lost by trying\n       again except the morning, but the game no longer lets a bad rep\n       pass unnoticed the way it once did.                                 */\n    exercises: {\n      art:'https://static.wixstatic.com/media/8e79ea_53fa9f33b68549559565e571c907f385~mv2.jpg', mark:'The exercises', label:'Every morning',\n      text:[\n        \"Th\\u00e9r\\u00e8se unwrapped the right hand for the first time and held his wrist steady, and told him what she was going to keep telling him every morning for as long as it took: five flexions. Curl them in toward the palm. Do not stop at four because four hurts less.\",\n        \"The skin across the knuckles was shiny and tight, one continuous sheet of new pink rather than a wound, and it fought him the way a stiff hinge fights a door.\",\n        \"\\u2018Cinq,\\u2019 she said, and waited, and did not do it for him, because doing it for him was the one thing that would not help.\"\n      ],\n      flex:{\n        reps:5, fillTime:1300, window:350, go:'cup', retry:'exercises',\n        cap:'Press. Hold. Release right at the top.',\n        allGood:'Five, clean, each one curled in and let go at exactly the moment it should have. He had not managed that before.',\n        allBad:'Not one of the five landed right \\u2014 short, or held on too long past where holding helped, every time. He put the hand back in his lap for a moment, then made himself begin again.',\n        mixed:'{good} of five landed clean. The rest went short, or ran on past where holding helped. Th\\u00e9r\\u00e8se said nothing, only waited for him to start the count over.'\n      }\n    },\n\n    cup: {\n      art:'https://static.wixstatic.com/media/8e79ea_b68e8e2ea6684b6e8881bd7a04419070~mv2.jpg', mark:'The cup', label:'Day eight',\n      text:[\n        \"A small dented tin cup on the coarse wool blanket, and his fingertips found the rim before his fingers found each other, which was as much as eight mornings of *cinq* had bought him.\",\n        \"He could not lift it. He could touch it, and know that it was there, and know that yesterday he could not have known even that.\",\n        \"Small stakes, made enormous by having nothing else to measure against. Th\\u00e9r\\u00e8se, watching from the doorway, said nothing about the cup, and everything with the not-saying.\"\n      ],\n      opts:[ { t:\"Let the days go on.\", go:'children' } ]\n    },\n\n    children: {\n      art:'https://static.wixstatic.com/media/8e79ea_8cf26d672b5a4610ac2e71749bb47032~mv2.jpg', mark:'The cloister', label:'The twelfth morning',\n      text:[\n        \"Out of uniform now, in a collarless shirt too big for him and someone else's dark trousers, he sat on the stone bench in the May sun where Jean-Baptiste had carried him out to sit, both hands wrapped and resting in his lap and the plastered leg out stiff in front of him, and watched thirty-two children go past in loose single file on their way to lessons.\",\n        \"One of them, a girl of perhaps seven, slowed enough to look at him properly \\u2014 not at the hands, which every adult managed not to look at, but at his face, with the frank unembarrassed attention children have before somebody teaches them not to.\",\n        \"She did not ask what had happened to him. She asked if he was going to get better.\"\n      ],\n      opts:[\n        { t:\"\\u2018Yes.\\u2019 And mean it, for her.\", worth:1, go:'children-warm' },\n        { t:\"\\u2018I don't know.\\u2019 It's the truer answer, and he's tired.\", go:'children-plain' }\n      ]\n    },\n\n    'children-warm': {\n      keep:true, label:'The twelfth morning',\n      text:[\n        \"\\u2018Yes,\\u2019 he said, and made himself hold her eye while he said it, because it was the answer a child deserved and because, that morning, he had almost believed it himself.\",\n        \"She nodded, satisfied, the way children are satisfied by an answer given properly rather than an answer that is true. \\u2018I'm just there,\\u2019 she said, and turned to point back at the building, at a window two along from his own, close enough to the wing they'd carried him into that he understood at once which room she meant. \\u2018Me and my brother. Right next to you.\\u2019 She said it the way she might have offered him a sweet \\u2014 a small thing, freely given, because he had looked at her like she mattered.\",\n        \"Then she went on with the others, and Th\\u00e9r\\u00e8se, watching from the doorway, said nothing about it \\u2014 which by now he knew meant she had noticed everything.\"\n      ],\n      opts:[ { t:\"Let her go on with the others.\", go:'children-close' } ]\n    },\n\n    'children-plain': {\n      keep:true, label:'The twelfth morning',\n      text:[\n        \"\\u2018I don't know,\\u2019 he said. It was the truer answer, and some mornings the truer answer was all he had the strength to give anyone, even a child in the May sun who hadn't asked for anything difficult.\",\n        \"She considered this with the same frank attention she'd given his face, decided it was an acceptable kind of honesty, and told him anyway, matter-of-fact rather than warm: \\u2018I'm in the room next to yours. Me and my brother.\\u2019 A fact offered the way children offer facts, without needing a reason.\",\n        \"Then she went on with the others, and Th\\u00e9r\\u00e8se, watching from the doorway, said nothing about any of it.\"\n      ],\n      opts:[ { t:\"Let her go on with the others.\", go:'children-close' } ]\n    },\n\n    'children-close': {\n      keep:true, label:'The twelfth morning',\n      text:[\n        \"Across the courtyard, he watched Th\\u00e9r\\u00e8se come out of her office \\u2014 an abbot's old parlour, carved mantel and all, put to use for ledgers and dressings instead \\u2014 with a thin stack of printed cards from a drawer, the same plain stock kept for every case of the disease working through the dormitories that spring, and pin one to a door before going back in. David watched her do it without knowing yet that he was watching the answer to a question he hadn't been asked.\"\n      ],\n      opts:[ { t:\"Let her go on with the others.\", go:'sparkplug-night' } ]\n    },\n\n    'sparkplug-night': {\n      art:'https://static.wixstatic.com/media/8e79ea_3e246a2d84dd492fa2a501ed8c5b4665~mv2.jpg', mark:'Alone, by candlelight', label:'That night',\n      text:[\n        \"By a single candle he took the spark plug from its brown paper, alone, when nobody was watching to see whether it mattered to him or not, and tried his hand around it the way a man tests a lock he already suspects is broken.\",\n        \"The fingers did not close all the way. They came close enough to feel the shape of it \\u2014 the hex of the body, the porcelain insulator, the small hard certainty of a thing built for one exact purpose \\u2014 and that was as far as they would go tonight.\",\n        \"Tommy was still at Longwood, nine years old, waiting for a piece of a Merlin engine his father had promised him. David put it back in the paper and did not let himself work out how many more nights like this one stood between here and Kent.\"\n      ],\n      opts:[ { t:\"Sleep.\", go:'warning' } ]\n    },\n\n    /* -------- 2.7b : the warning -------- */\n    warning: {\n      art:'https://static.wixstatic.com/media/8e79ea_988f8961b52c48ad939df62da11ca487~mv2.jpg', mark:'The warning', label:'Without preamble',\n      text:[\n        \"Th\\u00e9r\\u00e8se was in the doorway before he had finished waking, one hand still on the door, already half-turned to leave, speaking as though the sentence had started somewhere down the corridor and only now reached him.\",\n        \"\\u2018Ils inspectent le b\\u00e2timent. Deux officiers, un civil. Ils commencent au r\\u00e9fectoire.\\u2019 They're inspecting the building. Two officers, a clerk. They're starting at the refectory.\",\n        \"No explanation of who, or why now, or what an inspection this far from the coast could possibly be for. Only the fact of it, and then she was gone, back to the tour, back to leading it exactly as slowly as she always did \\u2014 because whatever happened in this room in the next few minutes, it would have to happen without her in it.\"\n      ],\n      opts:[ { t:\"Think.\", go:'corridor' } ]\n    },\n\n    /* -------- 2.7c : the corridor, which is also the map --------\n       an exam, not a jeopardy: he can't leave the bed, so the corridor\n       exists only in what he can reconstruct from sound.                   */\n    corridor: {\n      art:'https://static.wixstatic.com/media/8e79ea_bec5f7416c1d4ddbbbfa80259b2ee9b0~mv2.jpg', mark:'The corridor', label:'Listen first',\n      text:[\n        \"He could not stand, could not run, could not so much as sit up quickly. Whatever was going to get him through the next few minutes would have to come from the neck up.\",\n        \"He lay still and built the corridor out of sound \\u2014 the only version of it he was ever going to have.\"\n      ],\n      exam:{\n        cap:'Listen. Build the map in your head.',\n        clock:true, clockLabel:'Time', countdown:24, randomize:true,\n        timeoutText:'The sounds blurred together before he could place all of them \\u2014 he\\u2019d lost the thread of it, and had to steady himself and start listening again from nothing.',\n        require:['refectory','door','boots','range'],\n        spots:[\n          { k:'refectory', x:50, y:20, r:16, mono:'voices, far off', worth:0, text:[\n            \"Two men's voices, unhurried, and a third lighter one asking questions and writing down the answers. The refectory. Still the length of the building away.\"\n          ]},\n          { k:'door', x:22, y:55, r:14, mono:'a door, somewhere close', worth:0, text:[\n            \"A door, opened and not yet closed. Someone was moving room to room, not corridor to corridor \\u2014 which meant there was still time, but not much of it.\"\n          ]},\n          { k:'boots', x:70, y:62, r:14, mono:'boots on stone', worth:0, text:[\n            \"Boot heels on flagstone, three sets, matched in pace. Nobody in a hurry. Th\\u00e9r\\u00e8se's own footsteps, when he could pick them out from the others, were exactly as unhurried \\u2014 on purpose.\"\n          ]},\n          { k:'range', x:40, y:82, r:15, mono:'the kitchen range', worth:0, text:[\n            \"A pan set down, too hard, and a word of apology in French. The kitchen. Between the refectory and this corridor. Which meant the order of the tour, and roughly how long he had.\"\n          ]}\n        ]\n      },\n      next:{ t:'Think faster.', go:'instruct' }\n    },\n\n    /* -------- the plan : the tin cup, the wall, and two children --------\n       reuses the buildSearch engine \\u2014 one guess, real consequences \\u2014 but\n       the choice is an instruction given to someone else, not a door David\n       walks through himself. He never leaves the bed.                     */\n    instruct: {\n      keep:true, label:'Two children, a wall between them',\n      text:[\n        \"The tin cup was still on the chair by the bed. He got it between both palms, more weight than his fingers could grip, and struck it against the wall three times \\u2014 the only signal he had, and the only part of any of this his hands could still do.\",\n        \"A pause, then a scrape of feet on the other side of the wall. Two faces at his door a moment later \\u2014 a boy of about ten, and behind him the girl from the cloister bench, still in her nightdress, recognising him a half-second before he recognised her.\",\n        \"He had perhaps one instruction left before the tour reached this corridor. It needed to be the right one.\"\n      ],\n      search:{\n        cap:'Tell them what to do. There is no time to tell them twice.',\n        lose:'search',\n        go:'sign',\n        opts:[\n          { t:'Hide the flying jacket in the chapel.', alley:true, art:'https://static.wixstatic.com/media/8e79ea_15ce81299d1d4a7892c930c785b7a966~mv2.jpg', mono:'The chapel',\n            cost:\"The boy was gone a full minute before David understood the mistake: two children carrying a scorched leather jacket across half the building was its own kind of evidence, walking. He heard the voices reach the corridor before either child came back.\",\n            verdict:'The children were stopped in the chapel' },\n          { t:'Run and fetch Th\\u00e9r\\u00e8se from the cloister.', alley:true, art:'https://static.wixstatic.com/media/8e79ea_e583bc78ff5c47d599dede0c4cecc378~mv2.jpg', mono:'The cloister garden',\n            cost:\"She was not in the cloister. She was exactly where the sound had placed her \\u2014 ahead of the tour, leading it \\u2014 and a child sent looking for her in the wrong place was a child noticed wandering while three Germans walked the halls.\",\n            verdict:'The girl was found wandering' },\n          { t:'Hide yourselves in the carved oak room until it passes.', alley:true, art:'https://static.wixstatic.com/media/8e79ea_c8f999d64e7e49fea67f8f8688752072~mv2.jpg', mono:'The carved oak room',\n            cost:\"Two more children now unaccounted for, in a house being walked room by room. He had solved nothing and multiplied the problem by two.\",\n            verdict:'Two children missing from where they should be' },\n          { t:'Get under the bed, both of you, and stay there.', alley:true, art:'https://static.wixstatic.com/media/8e79ea_9189d5d485524248acfd45c15ccd6149~mv2.jpg', mono:'Under the bed',\n            cost:\"A burned pilot alone in a bed was one kind of question. A burned pilot with two abbey children hiding underneath it was a question with no possible good answer, and he understood that half a second after he'd said it.\",\n            verdict:'Found with the children under the bed' },\n          { t:'Fetch the quarantine sign from Mme Papillon\\u2019s office. Put it on this door.', go:'sign' }\n        ]\n      }\n    },\n\n    /* -------- the sign returns, and the room becomes the answer -------- */\n    sign: {\n      art:'https://static.wixstatic.com/media/8e79ea_e0fd8dca26fe447d92b71edd5301e349~mv2.jpg', mark:'The sign', label:'On this door now',\n      text:[\n        \"They were back before he had let himself believe they'd manage it \\u2014 the boy with the small printed card from Th\\u00e9r\\u00e8se's own ledger drawer, breathless, and the girl already reaching up to fit it into the holder screwed to his door: <em>Notice M\\u00e9dicale \\u2014 Quarantaine \\u2014 Entr\\u00e9e Strictement Interdite.</em>\",\n        \"He had wondered, days ago, why a house full of sick children needed cards like this at all. Now he understood the card was not about the door. It was about what a man with a clipboard does when he reads it.\",\n        \"\\u2018Sit,\\u2019 he told them. \\u2018You, the end of the bed. You, the chair. Don't touch anything, don't hide \\u2014 just be children who are supposed to be here.\\u2019\"\n      ],\n      opts:[ { t:\"Wait for the footsteps.\", go:'cough' } ]\n    },\n\n    /* -------- the cough, timed \\u2014 a single decisive action -------- */\n    cough: {\n      keep:true, label:'The footsteps stop outside',\n      text:[\n        \"The boots stopped outside the door. A pause exactly long enough for a man to read a small printed card by lamplight.\",\n        \"The boy sat rigid at the end of the bed. The girl sat rigid in the wooden chair. Neither of them moved, watching his face for the one thing he could still give them: the moment.\"\n      ],\n      cough:{\n        cap:'Tell them: cough. Not yet. Not yet.',\n        early:\"One of them coughed before the silence outside had finished forming \\u2014 too soon, too obviously cued, a sound with no weight behind it. On the other side of the door, someone who had been about to move on stayed exactly where he was.\",\n        late:\"The handle had already begun to turn before either child made a sound. A held breath is not the same as an illness, and everyone on both sides of that door understood the difference at exactly the same moment.\",\n        go:'resolution',\n        lose:'search'\n      }\n    },\n\n    /* -------- resolution -------- */\n    resolution: {\n      art:'https://static.wixstatic.com/media/8e79ea_676ae3ab39d14320b5e2911bed6c7d30~mv2.jpg', mark:'After', label:'The word through the door',\n      text:[\n        \"The cough came at exactly the right second \\u2014 the girl's, thin and real enough, the boy's a beat after hers, the two of them overlapping the way sick children in the same room actually do, without any cue from him at all.\",\n        \"He heard the word before he understood he'd been waiting for it \\u2014 <em>tuberculose</em> \\u2014 said once, flatly, by the clerk, in the tone of a man closing a notebook. A pause. A second voice, shorter. Then boots, receding, at exactly the pace they had arrived.\",\n        \"Th\\u00e9r\\u00e8se's own voice, once, pitched exactly as bored as it had been all morning: \\u2018Comme vous voyez.\\u2019 As you see.\"\n      ],\n      opts:[ { t:\"Let the two of them go back to their own beds.\", go:'leaving' } ]\n    },\n\n    /* -------- 2.8 : leaving the abbey -------- */\n    leaving: {\n      art:'https://static.wixstatic.com/media/8e79ea_8aea53738a45467e9cd25539aa3b1643~mv2.jpg', mark:'Leaving', label:'Dawn, three weeks on',\n      text:[\n        \"The rear doors of the van stood open long enough for one last look back \\u2014 the courtyard, the ancient pear tree trained flat against pale stone, cobbles going grey in the first light \\u2014 before the trees closed in around the lane and took the whole picture away.\",\n        \"Twenty-one days. A name he would carry the rest of his life and could never write down anywhere it might be found. A cup he could almost lift.\",\n        \"Th\\u00e9r\\u00e8se did not come out to see the van go. That, too, he understood by now, was the point.\"\n      ],\n      opts:[ { t:\"Let the abbey go.\", go:'END' } ]\n    }\n\n  };\n\n  var shownArt = null;\n\n  function loadArt(file, mark){\n    if(shownArt === file) return;\n    shownArt = file;\n    art.classList.remove('shown');\n    hmark.textContent = mark || '';\n    /* file may be a bare local filename (images/foo.jpg) or a full hosted\n       URL (e.g. Wix media) \u2014 only prefix with images/ for the former. */\n    var src = /^https?:\\/\\//.test(file) ? file : 'images/' + file;\n    hfile.textContent = src;\n    holder.classList.remove('gone');\n    var probe = new Image();\n    probe.onload = function(){\n      if(shownArt !== file) return;\n      art.src = probe.src;\n      art.classList.add('shown');\n      holder.classList.add('gone');\n    };\n    probe.src = src;\n  }\n\n  function paint(name){\n    var s = scenes[name];\n    if(!s) return;\n    currentScene = name;\n\n    if(!s.keep && s.art){ loadArt(s.art, s.mark); }\n\n    label.textContent = s.label || '';\n\n    prose.innerHTML = '';\n    (s.text || []).forEach(function(t){\n      var p = document.createElement('p');\n      p.innerHTML = t;\n      prose.appendChild(p);\n    });\n    if(s.said){\n      var q = document.createElement('p');\n      q.className = 'said';\n      q.textContent = s.said;\n      prose.appendChild(q);\n    }\n    (s.after || []).forEach(function(t){\n      var p = document.createElement('p');\n      p.innerHTML = t;\n      prose.appendChild(p);\n    });\n\n    prose.classList.remove('after-flash');\n    if(s.flash){\n      flash.classList.remove('go');\n      prose.classList.remove('after-flash');\n      void flash.offsetWidth;\n      flash.classList.add('go');\n      prose.classList.add('after-flash');\n    }\n\n    picks.innerHTML = '';\n\n    if(s.exam){ buildExam(s, name); }\n    else {\n      document.getElementById('exam').classList.remove('on');\n      script.classList.remove('through');\n      if(s.hold){ buildHold(s); }\n      else if(s.flex){ buildFlex(s); }\n      else if(s.search){ buildSearch(s); }\n      else if(s.cough){ buildCough(s); }\n      else {\n        (s.opts || []).forEach(function(o){\n          if(o.need && !spent[o.need]) return;\n          if(o.key && spent[o.key]){\n            var d = document.createElement('button');\n            d.className = 'pick done';\n            d.type = 'button';\n            d.disabled = true;\n            d.textContent = o.t;\n            picks.appendChild(d);\n            return;\n          }\n          picks.appendChild(button(o.t, function(){\n            if(o.worth) steady += o.worth;\n            if(o.key) spent[o.key] = true;\n            if(o.lose){ lose(o.lose); return; }\n            if(o.go === 'END') finish(); else paint(o.go);\n          }));\n        });\n      }\n    }\n\n    script.scrollTop = 0;\n  }\n\n  function button(text, fn){\n    var b = document.createElement('button');\n    b.className = 'pick';\n    b.type = 'button';\n    b.textContent = text;\n    b.addEventListener('click', fn);\n    return b;\n  }\n\n  /* ---------- examine ----------\n     Attention is a lens. The frame is dimmed except where you are looking.\n     Hold your attention on something for a moment and it resolves.\n     Nothing here is a puzzle: you can leave whenever you like.            */\n\n  function buildExam(s, name){\n    var cfg  = s.exam;\n    var exam = document.getElementById('exam');\n    var ring = document.getElementById('ring');\n    var dwl  = document.getElementById('dwell');\n    var cap  = document.getElementById('examcap');\n    var t0   = performance.now();\n\n    exam.querySelectorAll('.pin').forEach(function(p){ p.remove(); });\n    exam.classList.add('on');\n    script.classList.add('through');\n    cap.firstChild.textContent = cfg.cap || '';\n\n    var clockEl = document.getElementById('examclock');\n    clockEl.innerHTML = cfg.clock ? '<span></span>' : '';\n    var clockSpan = clockEl.querySelector('span');\n\n    var W = 0, H = 0;\n    function measure(){\n      var r = exam.getBoundingClientRect();\n      W = r.width; H = r.height;\n      return r;\n    }\n    measure();\n\n    /* reshuffle where each cue sits, so a retry can't just be memorised.\n       Rejection-sampled so spots don't land on top of each other.       */\n    if(cfg.randomize){\n      var placed = [];\n      cfg.spots.forEach(function(sp){\n        var x, y, tries = 0, ok;\n        do{\n          x = 12 + Math.random() * 76;\n          y = 16 + Math.random() * 68;\n          ok = placed.every(function(p){\n            var dx = x - p.x, dy = y - p.y;\n            return Math.sqrt(dx*dx + dy*dy) > (sp.r + p.r + 8);\n          });\n          tries++;\n        } while(!ok && tries < 40);\n        sp.x = Math.round(x); sp.y = Math.round(y);\n        placed.push({x:x, y:y, r:sp.r});\n      });\n    }\n\n    var live = cfg.spots.filter(function(sp){ return !looked[sp.k]; });\n    var fieldArt = s.art;\n    var heldAt = 0;\n\n    /* a detail cut stays up while the passage is read, then the field returns */\n    function detail(sp){\n      if(sp.art){ loadArt(sp.art, sp.mono); heldAt = performance.now(); }\n      else { loadArt(fieldArt, s.mark); heldAt = 0; }\n    }\n    function backToField(){\n      if(shownArt !== fieldArt && heldAt && performance.now() - heldAt > 1400){\n        loadArt(fieldArt, s.mark);\n        heldAt = 0;\n      }\n    }\n\n    /* pins for anything already found on a previous visit */\n    cfg.spots.forEach(function(sp){\n      if(looked[sp.k]) addPin(sp, false);\n    });\n\n    function addPin(sp, faint){\n      var p = document.createElement('div');\n      p.className = 'pin' + (faint ? ' faint' : '');\n      p.style.left = sp.x + '%';\n      p.style.top  = sp.y + '%';\n      exam.appendChild(p);\n    }\n\n    var dwellOn = null, dwellStart = 0, raf = null, showing = null;\n\n    /* re-reading: hovering something already found brings its passage back */\n    function replay(sp){\n      if(showing === sp.k) return;\n      showing = sp.k;\n      detail(sp);\n      prose.innerHTML = '';\n      var head = document.createElement('p');\n      head.className = 'moved';\n      head.style.marginTop = '0';\n      head.textContent = sp.mono;\n      prose.appendChild(head);\n      (sp.text || []).forEach(function(tx){\n        var p = document.createElement('p');\n        p.innerHTML = tx;\n        prose.appendChild(p);\n      });\n      script.scrollTop = 0;\n    }\n\n    function moveTo(cx, cy){\n      var r = measure();\n      var mx = cx - r.left, my = cy - r.top;\n      exam.style.setProperty('--mx', mx + 'px');\n      exam.style.setProperty('--my', my + 'px');\n\n      backToField();\n\n      var px = mx / W * 100, py = my / H * 100;\n\n      /* already found and hovered again? show it again. */\n      for(var i = 0; i < cfg.spots.length; i++){\n        var f = cfg.spots[i];\n        if(!looked[f.k]) continue;\n        var fx = px - f.x, fy = py - f.y;\n        if(Math.sqrt(fx*fx + fy*fy) <= f.r){ replay(f); break; }\n      }\n\n      /* nearest unfound hotspot, in normalised units */\n      var near = null, nd = 1e9;\n      live.forEach(function(sp){\n        if(looked[sp.k]) return;\n        var dx = px - sp.x;\n        var dy = py - sp.y;\n        var d = Math.sqrt(dx*dx + dy*dy);\n        if(d < nd){ nd = d; near = sp; }\n      });\n\n      if(near){\n        var inside = nd <= near.r;\n        /* warmth from 0 at 3x radius to 1 at the edge */\n        var warm = Math.max(0, Math.min(1, 1 - (nd - near.r) / (near.r * 2)));\n        exam.style.setProperty('--ro', (0.16 + warm * 0.62).toFixed(3));\n        exam.style.setProperty('--rs', (1 - warm * 0.34).toFixed(3));\n        exam.style.setProperty('--rw', warm.toFixed(3));\n        ring.classList.toggle('hot', inside);\n\n        if(inside){\n          if(dwellOn !== near){ dwellOn = near; dwellStart = performance.now(); }\n        } else {\n          dwellOn = null;\n          exam.style.setProperty('--dwo', 0);\n          exam.style.setProperty('--dw', 0);\n        }\n      } else {\n        ring.classList.remove('hot');\n        exam.style.setProperty('--ro', .16);\n        exam.style.setProperty('--rs', 1);\n        exam.style.setProperty('--rw', 0);\n      }\n    }\n\n    var timedOut = false;\n\n    function timeout(){\n      if(timedOut) return;\n      timedOut = true;\n      if(raf) cancelAnimationFrame(raf);\n      exam.removeEventListener('mousemove', onMove);\n      /* a failed pass starts clean \\u2014 clear what this scene found so a\n         retry can't just be played back from memory of where things were */\n      cfg.spots.forEach(function(sp){ delete looked[sp.k]; });\n\n      prose.innerHTML = '';\n      var n = document.createElement('p');\n      n.className = 'moved';\n      n.textContent = cfg.timeoutText || 'Too slow. He\\u2019d run out of time to listen.';\n      prose.appendChild(n);\n      script.scrollTop = 0;\n\n      picks.innerHTML = '';\n      picks.appendChild(button('Start again.', function(){\n        exam.classList.remove('on');\n        clockEl.innerHTML = '';\n        paint(name);\n      }));\n    }\n\n    function loop(t){\n      if(timedOut) return;\n      if(clockSpan){\n        if(cfg.countdown){\n          var left = Math.max(0, cfg.countdown - (performance.now() - t0) / 1000);\n          clockSpan.textContent = (cfg.clockLabel || 'Time') + ' \\u2014 ' + left.toFixed(1) + 's';\n          if(left <= 0){ timeout(); return; }\n        } else {\n          var secs = Math.floor((performance.now() - t0) / 1000);\n          clockSpan.textContent = (cfg.clockLabel || 'Elapsed') + ' \\u2014 ' + secs + 's';\n        }\n      }\n      if(dwellOn){\n        var p = Math.min(1, (t - dwellStart) / 430);\n        exam.style.setProperty('--dwo', 1);\n        exam.style.setProperty('--dw', p.toFixed(3));\n        if(p >= 1){ found(dwellOn); }\n      }\n      raf = requestAnimationFrame(loop);\n    }\n    raf = requestAnimationFrame(loop);\n\n    function found(sp){\n      dwellOn = null;\n      exam.style.setProperty('--dwo', 0);\n      exam.style.setProperty('--dw', 0);\n      if(looked[sp.k]) return;\n      looked[sp.k] = true;\n      showing = sp.k;\n      detail(sp);\n      steady += (sp.worth || 0);\n      addPin(sp, false);\n\n      if(sp.flash){\n        flash.classList.remove('go');\n        void flash.offsetWidth;\n        flash.classList.add('go');\n      }\n\n      /* one assessment at a time \u2014 replace what was there rather than piling up */\n      prose.innerHTML = '';\n      var head = document.createElement('p');\n      head.className = 'moved';\n      head.style.marginTop = '0';\n      head.textContent = sp.mono;\n      prose.appendChild(head);\n      (sp.text || []).forEach(function(tx){\n        var p = document.createElement('p');\n        p.innerHTML = tx;\n        prose.appendChild(p);\n      });\n      script.scrollTop = 0;\n\n      live = cfg.spots.filter(function(x){ return !looked[x.k]; });\n      refresh();\n    }\n\n    /* pointer wiring */\n    function onMove(e){\n      if(e.touches && e.touches.length){ moveTo(e.touches[0].clientX, e.touches[0].clientY); }\n      else { moveTo(e.clientX, e.clientY); }\n    }\n    exam.addEventListener('mousemove', onMove);\n    exam.addEventListener('touchstart', function(e){ e.preventDefault(); onMove(e); }, {passive:false});\n    exam.addEventListener('touchmove',  function(e){ e.preventDefault(); onMove(e); }, {passive:false});\n    exam.addEventListener('mouseleave', function(){\n      exam.style.setProperty('--mx','-999px');\n      exam.style.setProperty('--my','-999px');\n      dwellOn = null;\n      exam.style.setProperty('--dwo', 0);\n    });\n\n    /* the proceed line, and the accessible way out */\n    var nameBtn = null;\n\n    function refresh(){\n      picks.innerHTML = '';\n\n      var need = cfg.require || [];\n      var outstanding = need.filter(function(k){ return !looked[k]; });\n\n      if(outstanding.length === 0){\n        picks.appendChild(button(s.next.t, function(){\n          if(name){ examTimes[name] = performance.now() - t0; }\n          teardown();\n          paint(s.next.go);\n        }));\n      } else {\n        /* he has not finished. no way onward yet. */\n        var wait = document.createElement('p');\n        wait.className = 'moved';\n        wait.style.marginTop = '.9rem';\n        wait.textContent = outstanding.length === 1\n          ? 'Keep assessing. One thing still unaccounted for.'\n          : 'Keep assessing. ' + outstanding.length\n            + ' things still unaccounted for.';\n        picks.appendChild(wait);\n      }\n\n      var total = cfg.spots.length;\n      var got   = cfg.spots.filter(function(x){ return looked[x.k]; }).length;\n\n      if(got < total && !cfg.countdown){\n        nameBtn = document.createElement('button');\n        nameBtn.id = 'namebtn';\n        nameBtn.type = 'button';\n        nameBtn.textContent = 'Name what he can reach';\n        nameBtn.addEventListener('click', function(){\n          cfg.spots.forEach(function(sp){ if(!looked[sp.k]) addPin(sp, true); });\n          nameBtn.classList.remove('show');\n          nameBtn.disabled = true;\n        });\n        picks.appendChild(nameBtn);\n        setTimeout(function(){\n          if(nameBtn && !nameBtn.disabled) nameBtn.classList.add('show');\n        }, 15000);\n      }\n    }\n\n    function teardown(){\n      if(raf) cancelAnimationFrame(raf);\n      shownArt = null;\n      script.classList.remove('through');\n      exam.classList.remove('on');\n      exam.removeEventListener('mousemove', onMove);\n      exam.querySelectorAll('.pin').forEach(function(p){ p.remove(); });\n      exam.style.setProperty('--mx','-999px');\n      exam.style.setProperty('--my','-999px');\n      clockEl.innerHTML = '';\n    }\n\n    refresh();\n  }\n\n  /* ---------- the count ----------\n     Ten beats, kept steady. Let the rhythm go and his attention goes with it,\n     and the leg moves, and the stalks move. This is the counting motif that\n     Th\u00e9r\u00e8se will hand back to him at the abbey.                              */\n\n  /* ---------- the count ----------\n     Tap steadily to the number, then stop. Let the rhythm go and his attention\n     goes with it. Tap once past it and he has moved more than he meant to.\n     Either way the leg moves, and the stalks move with it.                   */\n\n  function buildHold(s){\n    var cfg    = (typeof s.hold === 'object') ? s.hold : {};\n    var GAP    = cfg.gap  || 620;   /* longest tolerable pause between beats */\n    var NEED   = cfg.need || 10;    /* beats required */\n    var SETTLE = cfg.settle || 900; /* stillness needed after the last beat */\n\n    var wrap = document.createElement('div');\n    wrap.id = 'hold';\n    wrap.tabIndex = 0;\n    wrap.setAttribute('role','button');\n    wrap.setAttribute('aria-label','Tap steadily to ' + NEED + ', then stop');\n    wrap.innerHTML =\n      '<div class=\"fill\"></div>' +\n      '<span class=\"cap\">' + (cfg.cap || 'Count \\u2014 then stop') + '</span>' +\n      '<span class=\"beat\"></span>';\n    picks.appendChild(wrap);\n    script.scrollTop = script.scrollHeight;\n\n    var fill = wrap.querySelector('.fill');\n    var beat = wrap.querySelector('.beat');\n    var count = 0, last = 0, watch = null, done = false, full = false;\n\n    function show(){\n      beat.textContent = count ? (count + ' / ' + NEED) : '';\n      fill.style.transform = 'scaleX(' + Math.min(count / NEED, 1) + ')';\n    }\n\n    function fail(msg, verdict){\n      if(done) return;\n      done = true;\n      if(watch){ clearTimeout(watch); watch = null; }\n      wrap.classList.remove('let');\n      if(!cfg.practice){\n        flash.classList.remove('go');\n        void flash.offsetWidth;\n        flash.classList.add('go');\n      }\n\n      var v = document.createElement('p');\n      v.className = 'verdict';\n      v.textContent = verdict;\n      prose.appendChild(v);\n\n      var n = document.createElement('p');\n      n.className = 'moved';\n      n.style.marginTop = '0';\n      n.textContent = msg;\n      prose.appendChild(n);\n      picks.innerHTML = '';\n      script.scrollTop = script.scrollHeight;\n\n      if(cfg.practice){\n        if(cfg.penalty){ steady = Math.max(0, steady - cfg.penalty); }\n        if(cfg.retry){\n          picks.appendChild(button('Try again.', function(){ paint(cfg.retry); }));\n        } else {\n          picks.appendChild(button('Continue.', function(){ paint(cfg.go || 'cup'); }));\n        }\n        return;\n      }\n      if(cfg.soft){\n        steady = Math.max(0, steady - (cfg.cost || 2));\n        picks.appendChild(button('Continue.', function(){ lose(cfg.lose || 'lift', verdict, true); }));\n        return;\n      }\n      picks.appendChild(button('Continue.', function(){ lose(cfg.lose || 'road', verdict); }));\n    }\n\n    function slow(){\n      var verdict = (count === 0)\n        ? 'You did not start the count'\n        : 'Too slow \\u2014 the count broke at ' + count + ' of ' + NEED;\n      fail(cfg.slowText || 'The count went ragged, and his attention went with it.', verdict);\n    }\n    function over(){\n      fail(cfg.overText || 'One more than he meant to. Nothing at all, and everything.',\n           'Too many \\u2014 one tap past ' + NEED);\n    }\n\n    function beatOnce(e){\n      if(e && e.cancelable) e.preventDefault();\n      if(done) return;\n\n      if(full){ over(); return; }\n\n      var now = performance.now();\n      if(count > 0 && now - last > GAP){ slow(); return; }\n      last = now;\n      count++;\n      wrap.classList.add('let');\n      show();\n\n      if(count >= NEED){\n        full = true;\n        if(watch){ clearTimeout(watch); watch = null; }\n        wrap.classList.add('brim');\n        watch = setTimeout(function(){\n          if(done) return;\n          done = true;\n          if(cfg.bonus){ steady += cfg.bonus; }\n          beat.textContent = '\\u00b7\\u00b7\\u00b7\\u00b7\\u00b7';\n          setTimeout(function(){ paint(cfg.go || 'stopped'); }, 500);\n        }, SETTLE);\n        return;\n      }\n\n      if(watch) clearTimeout(watch);\n      watch = setTimeout(slow, GAP);\n    }\n\n    wrap.addEventListener('mousedown', beatOnce);\n    wrap.addEventListener('touchstart', beatOnce, {passive:false});\n    wrap.addEventListener('keydown', function(e){\n      if(e.code === 'Space' || e.key === ' ' || e.key === 'Enter'){ beatOnce(e); }\n    });\n  }\n\n  /* ---------- the flex ----------\n     Press and hold. A bar climbs while the mouse (or finger) stays down.\n     Release too soon and the flex never finished \\u2014 the curl stopped\n     short. Release too late, past the top, and it's held past where\n     holding helped, the same overreach as the leg-setting scene. The only\n     right answer is a clean release right as the bar crests. Five reps,\n     practice mode throughout \\u2014 no capture, just a tally that colours the\n     scene's own ending text, same principle as the flexions always had,\n     just asked of the player's timing instead of a tap count.            */\n\n  function buildFlex(s){\n    var cfg    = (typeof s.flex === 'object') ? s.flex : {};\n    var REPS   = cfg.reps     || 5;\n    var FILL   = cfg.fillTime || 1300;\n    var WINDOW = cfg.window   || 350;\n\n    var wrap = document.createElement('div');\n    wrap.id = 'flex';\n    wrap.tabIndex = 0;\n    wrap.setAttribute('role','button');\n    wrap.setAttribute('aria-label','Press and hold, then release at the top');\n    wrap.innerHTML =\n      '<div class=\"fill\"></div>' +\n      '<span class=\"cap\">' + (cfg.cap || 'Press. Hold. Release right at the top.') + '</span>' +\n      '<span class=\"reps\">Rep 1 of ' + REPS + '</span>' +\n      '<span class=\"beat\"></span>';\n    picks.appendChild(wrap);\n    script.scrollTop = script.scrollHeight;\n\n    var fill = wrap.querySelector('.fill');\n    var repsEl = wrap.querySelector('.reps');\n    var beat = wrap.querySelector('.beat');\n\n    var rep = 0, good = 0, early = 0, late = 0;\n    var pressing = false, pressAt = 0, fullAt = 0, raf = null;\n    var lateFired = false, awaitingRelease = false, ended = false;\n\n    function repsText(){\n      repsEl.textContent = ended ? '' : 'Rep ' + Math.min(rep + 1, REPS) + ' of ' + REPS;\n    }\n    repsText();\n\n    function loop(){\n      if(pressing){\n        var t = performance.now() - pressAt;\n        if(t < FILL){\n          fill.style.transform = 'scaleX(' + (t / FILL) + ')';\n          wrap.classList.remove('window');\n        } else {\n          fill.style.transform = 'scaleX(1)';\n          if(!fullAt) fullAt = performance.now();\n          wrap.classList.add('window');\n          beat.textContent = 'Release.';\n          var since = performance.now() - fullAt;\n          if(since > WINDOW && !lateFired){\n            lateFired = true;\n            settleRep('late');\n          }\n        }\n      }\n      raf = requestAnimationFrame(loop);\n    }\n    raf = requestAnimationFrame(loop);\n\n    function resetBar(){\n      fill.style.transform = 'scaleX(0)';\n      wrap.classList.remove('window');\n      fullAt = 0; lateFired = false;\n    }\n\n    function settleRep(kind){\n      pressing = false;\n      if(kind === 'good'){ good++; beat.textContent = 'Held it.'; }\n      else if(kind === 'early'){ early++; beat.textContent = 'Too soon.'; }\n      else { late++; beat.textContent = 'Too long.'; }\n\n      rep++;\n      resetBar();\n\n      if(rep >= REPS){\n        finish();\n        return;\n      }\n      /* only 'late' fires while the mouse is still physically down (the\n         rAF loop catches it mid-hold) \\u2014 that's the one case where the\n         player needs to actually let go before the next press can start.\n         'early' and 'good' both fire from inside release() itself, which\n         means the mouse has already come up by the time we get here;\n         gating those too would silently swallow the player's very next\n         legitimate press.                                                */\n      if(kind === 'late'){ awaitingRelease = true; }\n      repsText();\n    }\n\n    function finish(){\n      ended = true;\n      wrap.remove();\n      var perfect = (good === REPS);\n      if(cfg.bonus && perfect){ steady += cfg.bonus; }\n      else if(cfg.penalty && good === 0){ steady = Math.max(0, steady - cfg.penalty); }\n\n      var line;\n      if(perfect) line = cfg.allGood || 'All five, clean.';\n      else if(good === 0) line = cfg.allBad || 'None of the five landed right.';\n      else line = (cfg.mixed || 'Some landed, some didn\\u2019t \\u2014 {good} of {reps} clean.')\n        .replace('{good}', good).replace('{reps}', REPS);\n\n      var n = document.createElement('p');\n      n.className = 'moved';\n      n.textContent = line;\n      prose.appendChild(n);\n      script.scrollTop = script.scrollHeight;\n\n      picks.innerHTML = '';\n      if(perfect || !cfg.retry){\n        picks.appendChild(button('Continue.', function(){ paint(cfg.go || 'cup'); }));\n      } else {\n        picks.appendChild(button('Try again.', function(){ paint(cfg.retry); }));\n      }\n    }\n\n    function press(e){\n      if(e.cancelable) e.preventDefault();\n      if(ended || pressing) return;\n      if(awaitingRelease) return; /* still holding from the last rep \\u2014 let go first */\n      pressing = true;\n      pressAt = performance.now();\n      fullAt = 0; lateFired = false;\n      beat.textContent = '';\n    }\n\n    function release(){\n      if(awaitingRelease){ awaitingRelease = false; return; }\n      if(ended || !pressing) return;\n      var t = performance.now() - pressAt;\n      if(t < FILL){ settleRep('early'); }\n      else if(!lateFired){ settleRep('good'); }\n    }\n\n    wrap.addEventListener('mousedown', press);\n    wrap.addEventListener('touchstart', press, {passive:false});\n    wrap.addEventListener('mouseup', release);\n    wrap.addEventListener('mouseleave', function(){ if(pressing) release(); });\n    wrap.addEventListener('touchend', release);\n    wrap.addEventListener('touchcancel', release);\n  }\n\n  /* ---------- the search ----------\n     Every wrong door gets its own room and its own picture \\u2014 the player\n     sees exactly where the guess went wrong \\u2014 but there is no second\n     guess. One wrong door is capture, immediately. The classic adventure-\n     game death state, played straight: no partial credit, no strikes to\n     spend, no way to learn the right answer by process of elimination\n     without paying for every wrong one in full.                          */\n\n  function buildSearch(s){\n    var cfg = (typeof s.search === 'object') ? s.search : {};\n    var done = false;\n\n    var cap = document.createElement('div');\n    cap.id = 'searchcap';\n    cap.textContent = cfg.cap || 'Choose.';\n    picks.appendChild(cap);\n\n    function render(){\n      picks.querySelectorAll('.pick').forEach(function(el){ el.remove(); });\n      (cfg.opts || []).forEach(function(o){\n        picks.appendChild(button(o.t, function(){ pick(o); }));\n      });\n      script.scrollTop = script.scrollHeight;\n    }\n\n    function pick(o){\n      if(done) return;\n      if(!o.alley){ paint(cfg.go || o.go); return; }\n      done = true;\n\n      if(o.art){ loadArt(o.art, o.mono || o.t); }\n\n      prose.innerHTML = '';\n      var head = document.createElement('p');\n      head.className = 'moved';\n      head.style.marginTop = '0';\n      head.textContent = o.mono || o.t;\n      prose.appendChild(head);\n      var n = document.createElement('p');\n      n.innerHTML = o.cost;\n      prose.appendChild(n);\n      script.scrollTop = 0;\n\n      picks.innerHTML = '';\n      picks.appendChild(button('Continue.', function(){\n        lose(cfg.lose || 'search', o.verdict || 'Wrong door');\n      }));\n    }\n\n    render();\n  }\n\n  /* ---------- the cough ----------\n     One decisive, correctly-timed instruction \\u2014 the last thing David's\n     mind can still do for anyone, now that his hands and his leg are both\n     spoken for. A single button that means nothing until it means\n     everything: too early reads as cued, too late doesn't arrive before\n     the handle turns. There's no dragging this out \\u2014 one window, one\n     press, or none.                                                        */\n\n  function buildCough(s){\n    var cfg  = (typeof s.cough === 'object') ? s.cough : {};\n    var WAIT   = cfg.wait   || 1700;\n    var BASE   = cfg.window || 1200;\n\n    /* the corridor wasn't just atmosphere: how fast he placed the tour by\n       ear now sets how much margin he has here. Rushed listening bought\n       him nothing to work with; a slower, careful read of the sounds\n       earlier gives him a genuinely wider window to time this against.   */\n    var heard = examTimes['corridor'];\n    var pace  = (heard == null) ? 'normal' : (heard < 9000 ? 'rushed' : (heard > 16000 ? 'careful' : 'normal'));\n    var margin = pace === 'rushed' ? 0.72 : (pace === 'careful' ? 1.3 : 1);\n    var WINDOW = Math.round(BASE * margin);\n\n    var done = false, live = false;\n\n    if(pace === 'rushed'){\n      var note = document.createElement('p');\n      note.className = 'moved';\n      note.textContent = \"He'd moved fast through what he could hear, out in the corridor. Fast hadn't left him much feel for the rhythm of it, and he could feel that now, in how little room there was left to time this against.\";\n      prose.appendChild(note);\n    } else if(pace === 'careful'){\n      var note2 = document.createElement('p');\n      note2.className = 'moved';\n      note2.textContent = \"He'd taken his time placing them by ear, out in the corridor. Some of that patience was still with him \\u2014 a beat of margin he hadn't earned any other way.\";\n      prose.appendChild(note2);\n    }\n\n    var cap = document.createElement('div');\n    cap.id = 'searchcap';\n    cap.textContent = cfg.cap || 'Wait for it.';\n    picks.appendChild(cap);\n\n    var btn = button('...', function(){ press(); });\n    btn.disabled = false;\n    picks.appendChild(btn);\n    script.scrollTop = script.scrollHeight;\n\n    function settle(msg, verdict){\n      if(done) return;\n      done = true;\n      var n = document.createElement('p');\n      n.className = 'moved';\n      n.textContent = msg;\n      prose.appendChild(n);\n      script.scrollTop = script.scrollHeight;\n      picks.innerHTML = '';\n      picks.appendChild(button('Continue.', function(){\n        lose(cfg.lose || 'search', verdict);\n      }));\n    }\n\n    function press(){\n      if(done) return;\n      if(!live){ settle(cfg.early || 'Too soon.', 'Coughed too early'); return; }\n      done = true;\n      picks.innerHTML = '';\n      setTimeout(function(){ paint(cfg.go || 'resolution'); }, 300);\n    }\n\n    setTimeout(function(){\n      if(done) return;\n      live = true;\n      btn.textContent = 'Cough \\u2014 now';\n      setTimeout(function(){\n        if(done) return;\n        settle(cfg.late || 'Too late.', 'Coughed too late');\n      }, WINDOW);\n    }, WAIT);\n  }\n\n  /* ---------- capture ----------\n     He can only give up what he knows, and by now he knows people. Capture\n     here costs a network, not him \\u2014 no image, plain text, and the\n     consequence stated flatly in the network's own terms.                  */\n\n  var LOSSES = {\n    search: {\n      head: 'The door opened.',\n      note: 'Not the plan he needed. Somewhere in the last few minutes, a wrong '\n          + 'word, a wrong instruction, a beat of timing that gave the whole '\n          + 'room away \\u2014 and there was no version of this where two children '\n          + 'and a burned pilot in a marked bed talked their way back out of it '\n          + 'twice.',\n      cost: 'Th\\u00e9r\\u00e8se cannot explain a British airman in a French abbey to a '\n          + 'man with a clipboard. Nor can she explain the two children found '\n          + 'with him. What follows costs her, and Jean-Baptiste, and Dr '\n          + 'Leclerc, and thirty-two children with nowhere else built to take '\n          + 'them.',\n      foot: 'Th\\u00e9r\\u00e8se had known the risk since the morning she took him in.',\n      back: 'corridor'\n    }\n  };\n\n  var loseBack = 'corridor';\n\n  function lose(key, verdict, onward){\n    var L = LOSSES[key] || LOSSES.search;\n    loseBack = L.back;\n    document.querySelector('#taken .eyebrow').textContent = verdict || 'Taken';\n    document.getElementById('retry').textContent = onward ? 'Go on' : 'Again';\n    document.querySelector('#taken h2').textContent = L.head;\n    document.getElementById('takennote').textContent = L.note;\n    document.getElementById('takencost').textContent = L.cost;\n    document.querySelector('#taken .foot').textContent = L.foot;\n    document.getElementById('taken').classList.remove('gone');\n  }\n\n  function taken(){ lose('search'); }\n\n  document.getElementById('retry').addEventListener('click', function(){\n    document.getElementById('taken').classList.add('gone');\n    paint(loseBack);\n  });\n\n  function finish(){\n    var note = \"Twenty-one days in a house that ran on rules stated once and never repeated, and the one rule that mattered most \\u2014 five flexions, every morning, and do not stop \\u2014 was the one nobody could enforce but him. Th\\u00e9r\\u00e8se had shown him a door with a word on it that a search would not cross. At the Manoir, and after it, he would need to find versions of that door with nobody there to point at it for him.\";\n    document.getElementById('endnote').textContent = note;\n    closeC.classList.remove('gone');\n  }\n\n  document.getElementById('begin').addEventListener('click', function(){\n    openC.classList.add('gone');\n    paint('arrival');\n  });\n\n  document.getElementById('again').addEventListener('click', function(){\n    steady = 0; looked = {}; spent = {}; examTimes = {};\n    closeC.classList.add('gone');\n    paint('arrival');\n  });\n\n  /* ---------- save / resume ----------\n     Explicit save, not autosave \u2014 the player chooses the moment. Only the\n     scene name and the small state that shapes later text or mechanics\n     (steady, looked, spent, examTimes) are kept; nothing about an\n     in-progress hold, flex, or exam is preserved, so resuming always lands\n     at the start of a scene, never mid-mechanic.                          */\n\n  function doSave(){\n    try{\n      var data = { scene: curre   var CH3 = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>The Patient Ground \u2014 Chapter Three</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#14161a;\n    --linen:#ded8cd;\n    --lichen:#949a90;\n    --dawn:#c4867f;\n    --hair:rgba(222,216,205,.18);\n  }\n\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n\n  body{\n    background:#0b0c0e;\n    color:var(--linen);\n    font-family:'EB Garamond',Georgia,serif;\n    -webkit-font-smoothing:antialiased;\n    display:flex;align-items:center;justify-content:center;\n    overflow:hidden;\n  }\n\n  /* a phone-shaped frame, 9:16, as large as the window allows.\n     the art fills it exactly, so portrait images are never cropped. */\n  #stage{\n    position:relative;\n    width:min(100vw, calc(100dvh * 9 / 16));\n    height:min(100dvh, calc(100vw * 16 / 9));\n    background:var(--ink);\n    overflow:hidden;\n  }\n\n  /* ---------- art ---------- */\n\n  #art{\n    position:absolute;inset:0;\n    width:100%;height:100%;\n    object-fit:cover;display:block;\n    opacity:0;transition:opacity 1.1s ease;\n  }\n  #art.shown{opacity:1}\n\n  #holder{\n    position:absolute;inset:0;\n    display:flex;flex-direction:column;\n    align-items:center;justify-content:center;\n    gap:.85rem;text-align:center;padding:1.5rem;\n    background:radial-gradient(120% 70% at 50% 22%, #3a3630 0%, #24221e 55%, #1a1815 100%);\n  }\n  #holder.gone{display:none}\n  #holder .mark{\n    font-family:'Courier Prime',monospace;\n    font-size:.62rem;letter-spacing:.24em;\n    text-transform:uppercase;color:var(--lic
