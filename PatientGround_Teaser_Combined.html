-mask-image:radial-gradient(circle, transparent 62%, #000 64%);\n    mask-image:radial-gradient(circle, transparent 62%, #000 64%);\n    opacity:var(--dwo,0);\n    pointer-events:none;\n  }\n\n  .pin{\n    position:absolute;width:9px;height:9px;\n    transform:translate(-50%,-50%);\n    border-radius:50%;\n    border:1px solid rgba(222,216,205,.5);\n    background:rgba(196,134,127,.35);\n    pointer-events:none;\n  }\n  .pin.faint{\n    border-color:rgba(222,216,205,.22);\n    background:none;\n    animation:breathe 2.6s ease-in-out infinite;\n  }\n  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}\n\n  #examcap{\n    position:absolute;left:0;right:0;top:1rem;\n    text-align:center;\n    pointer-events:none;\n  }\n  #examcap span{\n    display:inline-block;\n    padding:.44rem .85rem;\n    background:rgba(14,16,19,.66);\n    -webkit-backdrop-filter:blur(4px);\n    backdrop-filter:blur(4px);\n    border:1px solid rgba(222,216,205,.16);\n    font-family:'Courier Prime',monospace;\n    font-size:.62rem;letter-spacing:.2em;\n    text-transform:uppercase;\n    color:#f0eade;\n  }\n  #examcap:empty{display:none}\n\n  #namebtn{\n    display:block;width:100%;background:none;border:0;\n    margin-top:.55rem;\n    font-family:'Courier Prime',monospace;\n    font-size:.56rem;letter-spacing:.18em;\n    text-transform:uppercase;color:rgba(148,154,144,.65);\n    cursor:pointer;text-align:center;\n    opacity:0;pointer-events:none;\n    transition:opacity .6s;\n  }\n  #namebtn.show{opacity:1;pointer-events:auto}\n  #namebtn:hover,#namebtn:focus-visible{color:var(--linen);opacity:1;pointer-events:auto}\n\n  /* ---------- flash ---------- */\n\n  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}\n\n  #savebtn{\n    position:absolute;top:.7rem;right:.7rem;z-index:20;\n    background:rgba(14,16,19,.66);\n    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);\n    border:1px solid rgba(222,216,205,.22);\n    color:var(--linen);\n    font-family:'Courier Prime',monospace;\n    font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;\n    padding:.4rem .65rem;cursor:pointer;\n    transition:border-color .3s,opacity .3s;\n  }\n  #savebtn:hover,#savebtn:focus-visible{border-color:var(--dawn);outline:none}\n  #flash.go{animation:blank 1.6s cubic-bezier(.16,.7,.3,1)}\n  /* hard onset, slow reluctant decay, two involuntary aftershocks in the tail */\n  @keyframes blank{\n    0%   {opacity:0}\n    3%   {opacity:1}\n    18%  {opacity:.97}\n    34%  {opacity:.58}\n    44%  {opacity:.74}\n    60%  {opacity:.24}\n    68%  {opacity:.38}\n    84%  {opacity:.07}\n    100% {opacity:0}\n  }\n\n  /* on flash scenes the prose arrives as the white lets go */\n  #prose.after-flash{animation:surface 1.1s ease-out .55s backwards}\n  @keyframes surface{from{opacity:0}to{opacity:1}}\n\n  /* ---------- cards ---------- */\n\n  .card{\n    position:absolute;inset:0;z-index:40;\n    background:var(--ink);\n    display:flex;flex-direction:column;\n    align-items:center;justify-content:center;\n    text-align:center;padding:2rem 1.7rem;gap:1rem;\n  }\n  .card.gone{display:none}\n  .card .eyebrow{\n    font-family:'Courier Prime',monospace;\n    font-size:.7rem;letter-spacing:.2em;\n    text-transform:uppercase;\n    color:var(--dawn);\n    max-width:30ch;line-height:1.6;\n  }\n  .card h1{font-weight:400;font-size:2rem;line-height:1.16}\n  .card h2{font-weight:400;font-size:1.26rem}\n  .card .thin{width:44px;height:1px;background:var(--hair)}\n  .card p{\n    font-size:.98rem;line-height:1.58;\n    color:rgba(222,216,205,.74);max-width:31ch;\n  }\n  .card .go{\n    margin-top:.5rem;background:none;\n    border:1px solid var(--hair);color:var(--linen);\n    font-family:'Courier Prime',monospace;\n    font-size:.62rem;letter-spacing:.24em;\n    text-transform:uppercase;\n    padding:.75rem 1.4rem;cursor:pointer;\n    transition:border-color .3s,color .3s;\n  }\n  .card .go:hover,.card .go:focus-visible{border-color:var(--dawn);color:#fff;outline:none}\n\n  .card .go.buy{\n    background:var(--dawn);border-color:var(--dawn);color:var(--ink);\n    font-weight:700;\n  }\n  .card .go.buy:hover,.card .go.buy:focus-visible{\n    background:#d6968f;border-color:#d6968f;color:var(--ink);\n  }\n  .card .again-link{\n    margin-top:.2rem;background:none;border:0;\n    font-family:'Courier Prime',monospace;\n    font-size:.6rem;letter-spacing:.18em;\n    text-transform:uppercase;\n    color:rgba(148,154,144,.65);\n    cursor:pointer;text-decoration:none;\n    transition:color .3s;\n  }\n  .card .again-link:hover,.card .again-link:focus-visible{color:var(--linen);outline:none}\n  .card .cost{\n    font-size:.95rem;line-height:1.62;\n    color:rgba(222,216,205,.6);\n    max-width:33ch;\n  }\n  .card .foot{\n    font-family:'Courier Prime',monospace;\n    font-size:.55rem;letter-spacing:.14em;\n    color:rgba(148,154,144,.55);\n    line-height:1.7;max-width:34ch;\n  }\n\n  @media (prefers-reduced-motion:reduce){\n    *{transition-duration:.01ms !important;animation-duration:.01ms !important}\n  }\n</style>\n</head>\n<body>\n\n<div id=\"stage\">\n\n  <img id=\"art\" alt=\"\">\n\n  <div id=\"holder\">\n    <span class=\"mark\" id=\"hmark\"></span>\n    <span class=\"rule\"></span>\n    <span class=\"file\" id=\"hfile\"></span>\n  </div>\n\n  <div id=\"veil\"></div>\n\n  <div id=\"exam\">\n    <div id=\"shade\"></div>\n    <div id=\"ring\"></div>\n    <div id=\"dwell\"></div>\n    <div id=\"examcap\"><span></span></div>\n  </div>\n\n  <div id=\"script\">\n    <div id=\"label\"></div>\n    <div id=\"prose\"></div>\n    <div id=\"choices\"></div>\n  </div>\n\n  <button id=\"savebtn\" type=\"button\">Save</button>\n\n  <div id=\"flash\"></div>\n\n  <div class=\"card\" id=\"open\">\n    <span class=\"eyebrow\">An interactive companion</span>\n    <h1>The Patient Ground</h1>\n    <span class=\"thin\"></span>\n    <h2>Chapter Three \u2014 The Manoir</h2>\n    <p>The Manoir de Gourlay, spring and summer 1941. Ten weeks in a house that keeps him by keeping rules \u2014 hers, and now his.</p>\n    <button class=\"go\" id=\"begin\">Begin</button>\n    <button class=\"again-link gone\" id=\"resume\">Resume where you left off</button>\n    <span class=\"foot\">Prototype. Chapter three only.</span>\n  </div>\n\n  <div class=\"card gone\" id=\"taken\">\n    <span class=\"eyebrow\">Taken</span>\n    <h2>Mme Tellier.</h2>\n    <span class=\"thin\"></span>\n    <p id=\"takennote\"></p>\n    <span class=\"thin\"></span>\n    <p class=\"cost\" id=\"takencost\"></p>\n    <button class=\"go\" id=\"retry\">Again</button>\n    <span class=\"foot\">She knew what she was risking before he ever climbed the stairs.</span>\n  </div>\n\n  <div class=\"card gone\" id=\"close\">\n    <span class=\"eyebrow\">Teaser complete</span>\n    <h2>Well done. You've completed the teaser.</h2>\n    <span class=\"thin\"></span>\n    <p id=\"endnote\"></p>\n    <p>The full game is coming soon. In the meantime \u2014</p>\n    <a class=\"go buy\" href=\"https://mybook.to/ThePatientGround\" target=\"_blank\" rel=\"noopener\">Buy the Book</a>\n    <a class=\"go\" href=\"#\" id=\"nextChapterLink\">Play from Chapter One</a>\n    <button class=\"again-link\" id=\"again\">Start Chapter Three again</button>\n    <span class=\"foot\">The Patient Ground \u2014 a novel by [Author Name]</span>\n  </div>\n\n</div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var art    = document.getElementById('art');\n  var holder = document.getElementById('holder');\n  var hmark  = document.getElementById('hmark');\n  var hfile  = document.getElementById('hfile');\n  var label  = document.getElementById('label');\n  var prose  = document.getElementById('prose');\n  var picks  = document.getElementById('choices');\n  var script = document.getElementById('script');\n  var flash  = document.getElementById('flash');\n  var openC  = document.getElementById('open');\n  var closeC = document.getElementById('close');\n\n  /* how carefully he's been paying attention \u2014 seeds the abbey mechanic */\n  var steady = 0;\n  var looked = {};\n  var spent  = {};   /* alternatives already exhausted, so they don't loop blind */\n  var currentScene = null;\n  var SAVE_KEY = 'tpg_save_ch3';\n\n  var scenes = {\n\n    arrival: {\n      art:'https://static.wixstatic.com/media/8e79ea_409886c870ca43679f0114c116b653c3~mv2.jpg', mark:'The Manoir de Gourlay', label:'After curfew',\n      text:[\n        \"The van came in past three shuttered doors on the north face, all the way round to a barn-style kitchen door at the eastern end, the village asleep behind its blackout. The driver helped him down. A woman filled the doorway before he'd found his feet, and took his whole weight without a word, his arm across her shoulders, and walked him through into the kitchen as though she did this every week.\",\n        \"She was somewhere past forty, iron-grey at the temples, built like a woman who ran an estate alone and had for years. Mme Tellier. \\u2018Th\\u00e9r\\u00e8se said you were brave,\\u2019 she said, once he was down in a chair. \\u2018She also said you were stubborn. Good. You will need to be both.\\u2019\",\n        \"She nodded at a low door beside the stove. \\u2018You cannot stay here. You must go up tonight. Quietly.\\u2019\"\n      ],\n      opts:[ { t:\"Go up.\", go:'plaster' } ]\n    },\n\n    plaster: {\n      art:'https://static.wixstatic.com/media/8e79ea_1202b9423ff64f54981f6feaaf34e826~mv2.jpg', mark:'The straw sack', label:'By the stove',\n      text:[\n        \"She looked at the plastered leg, then at the wooden stairs beyond the vestibule, and went to the scullery without explaining herself. She came back with a hessian sack stuffed thick with straw and wound it round the cast, tying it off at the knee with a strip of torn cloth.\",\n        \"\\u2018Le pl\\u00e2tre sur le bois, \\u00e7a s'entend dans toute la maison.\\u2019 Plaster on wood carries through the whole house. She did not wait for him to work out the French. Four German officers slept in the west wing, the far side of rooms he hadn't seen yet, and she was not the kind of woman who took chances she didn't have to.\",\n        \"The turret stood where the old hunting lodge met the kitchen block \\u2014 ten paces from where he sat, through a vestibule, up stairs neither of them could afford to make loud.\"\n      ],\n      opts:[ { t:\"Let her finish.\", go:'stairs' } ]\n    },\n\n    /* -------- the turret stairs -------- climb, with the near-miss on the\n       seventh step scripted in as a genuine beat rather than left to chance\n       \\u2014 per the novel, this actually happens on the one climb that\n       succeeds, and he still gets up. The sixteenth-step landing is the\n       other scripted beat, same as before.                                 */\n    stairs: {\n      art:'https://static.wixstatic.com/media/8e79ea_d630f66c67394808a15e168544dd506b~mv2.jpg', mark:'The turret stairs', label:'Thirty-five steps',\n      text:[\n        \"No rail worth gripping, and hands too burned to grip one anyway. Right leg down, then the plastered left swung wide of the central post \\u2014 weight, clear, weight, clear \\u2014 with Mme Tellier one step ahead in the dark, her hand finding the post before his did, guiding without a word wasted on it.\",\n        \"Sixteen steps to the landing. Nineteen more after that. Somewhere above them, officers who had never once troubled the upper floors, because a man now posted elsewhere had once written that the climb wasn't worth a search party's boots.\"\n      ],\n      climb:{\n        steps:35, gap:1100, maxStrikes:3,\n        beats:[\n          { at:7, text:'The plaster grazed the post \\u2014 not a strike, just a graze, but the sound of it went down the stairwell like a knuckle on a drum. Both of them stopped breathing. Nothing below stirred. He kept going.' },\n          { at:16, text:'The first landing. A draught from somewhere he couldn\\u2019t place. He kept going.' }\n        ],\n        go:'attic',\n        lose:'stairs'\n      }\n    },\n\n    /* -------- the attic -------- */\n    attic: {\n      art:'https://static.wixstatic.com/media/8e79ea_9415f410936342cb9dc393e7fad5e7c2~mv2.jpg', mark:'The attic room', label:'The first morning',\n      text:[\n        \"A sloped ceiling crossed with beams, and four dormers \\u2014 two south over the garden, where a walnut tree was just coming into leaf, and two north towards the road and the village. A cloakroom of his own at the eastern end, sink and toilet both, so the stairs would never need to know his name again at night.\",\n        \"He learned the house before he learned anything else about it. The range door had its own creak when she stoked it at six. The scullery pump took three strokes to fill a kettle, five for a basin, and he could tell the hour from the rhythm of it without ever seeing a clock.\",\n        \"Of the Germans, almost nothing reached him \\u2014 the whole depth of the old hunting lodge stood between his room and theirs, plus a room called the Salon Bleu, and the Green Room, and boarded-up doors past that. Mornings, two engines north and two motorbikes south, the same four men keeping the same clockwork hours. He would live above them for ten weeks and hear them, in all that time, only twice.\"\n      ],\n      opts:[ { t:\"Let the first day pass.\", go:'sergeant' } ]\n    },\n\n    /* -------- the sergeant at the barn door -------- pure listening, no\n       agency, no jeopardy: in the novel nothing goes wrong here, Mme\n       Tellier handles it entirely, and David's only task is enduring it.\n       A short practice-mode hold stands in for the minutes of forced\n       stillness, rhyming quietly with the cupboard scene still to come.   */\n    sergeant: {\n      art:'https://static.wixstatic.com/media/8e79ea_9415f410936342cb9dc393e7fad5e7c2~mv2.jpg', mark:'A voice at the barn door', label:'The third week',\n      keep:true,\n      text:[\n        \"A knock, faint, three floors down. A voice in accented French, asking after eggs \\u2014 ordinary, unhurried, exactly the kind of question a bored man asks on a slow morning. His heart went off like something dropped down a stairwell.\",\n        \"There was nothing whatever he could do about it. He could only lie still and let it happen to someone else on his behalf, the way almost everything here happened to someone else on his behalf.\",\n        \"Mme Tellier's voice reached him faintly, calm, politely cheerful \\u2014 the voice, he was learning, of a woman with nothing whatsoever to hide.\"\n      ],\n      hold:{\n        need:6, gap:1600, settle:500, practice:true, bonus:1, go:'exercises',\n        cap:'Hold still. Let her handle it.',\n        slowText:'His breath got away from him before the voices below had finished \\u2014 no one heard it, no one was listening for it, but he felt the failure anyway, privately, uselessly.',\n        overText:'He held long after the barn door had already closed, fists locked around nothing, still bracing for a knock that was never going to come.'\n      }\n    },\n\n    /* -------- exercises -------- reuses chapter two's flex mechanic\n       exactly: press, hold, release right at the top, five times. Mme\n       Tellier picked the method up by watching Th\\u00e9r\\u00e8se and never needed\n       to be told twice. Five clean reps or the set starts over \\u2014 same\n       retry rule as the abbey, now carried into the Manoir.               */\n    exercises: {\n      art:'https://static.wixstatic.com/media/8e79ea_f39963b13aaa4204b02ec647d32521a3~mv2.jpg', mark:'The exercises, continued', label:'Every morning',\n      text:[\n        \"She had found the method by standing in the doorway once and watching him do it alone. After that she counted for him herself \\u2014 one, two, three, four, five \\u2014 and held his wrist steady while he worked, the same routine Th\\u00e9r\\u00e8se had begun at the abbey, carried on now by a woman with no medical training at all and every instinct for it.\",\n        \"\\u2018Une main tenue est une main qui peut faire davantage,\\u2019 she told him once, not explaining further. A hand held steady is a hand that can do more. She did not say it like a kindness. She said it like a fact she expected him to catch up to.\"\n      ],\n      flex:{\n        reps:5, fillTime:1300, window:350, go:'crutches', retry:'exercises',\n        cap:'Press. Hold. Release right at the top.',\n        allGood:'Five, clean, every one released at exactly the right instant. Mme Tellier said nothing, which by now he knew to read as the whole of her approval.',\n        allBad:'None of the five landed right \\u2014 every rep short, or held on past where holding helped. She only counted again, the same patient one-two-three-four-five, and waited for him to begin the set over.',\n        mixed:'{good} of five landed clean. Not enough. \\u2018Encore,\\u2019 she said, and started the count again from one.'\n      }\n    },\n\n    crutches: {\n      art:'https://static.wixstatic.com/media/8e79ea_a5dbc87faa3d4cb3ba3503e32634b123~mv2.jpg', mark:'The walnut crutches', label:'The second week',\n      text:[\n        \"She made them herself, from two straight branches off the same walnut tree outside the south dormer, stripped and shaped, the crosspieces cut from leather straps off an old horse harness so his ruined hands would have something soft to bear on rather than bare wood.\",\n        \"Six paces from the bed to the dormer. Turn. Six paces back. He counted them the way Simmons used to count scrambles at Longwood, and the counting held the same way it always had, whatever it was counting.\",\n        \"From the dormer he could see all of it \\u2014 the walnut tree, the kitchen garden where Mme Tellier worked each morning, the fermette where her estate manager mended harnesses, bullocks moving slow across the south field, and beyond all of it the flat Picardy countryside, offering no cover at all to anyone who might be watching from it.\"\n      ],\n      opts:[ { t:\"Learn the rhythm of the house.\", go:'green-room' } ]\n    },\n\n    /* -------- the green room -------- corrected: marble hearth matching\n       Th\\u00e9r\\u00e8se's office at the abbey, an Erard piano, a ticking mantel\n       clock with a gilt cavalier \\u2014 and the game is specifically piquet.   */\n    'green-room': {\n      art:'https://static.wixstatic.com/media/8e79ea_4ab8f7e3babc4fd0a06a7e15cd00b374~mv2.jpg', mark:'The Green Room', label:'By firelight',\n      text:[\n        \"Some evenings, when the house judged it safe, Mme Tellier led him down to a room grander than anything he'd seen since Longwood \\u2014 a marble fireplace big enough to take logs the length of a man's arm, the same dark veined stone, oddly, as the hearth in Th\\u00e9r\\u00e8se's office at the abbey, as if for a moment the two rooms and the two women were the same room and the same woman either side of the same war.\",\n        \"An upright piano stood against the far wall, fallboard shut, Erard in gold on the case. On the mantel, a black marble clock with a gilt cavalier figure, hat cocked, one hand on his hip \\u2014 ticking, which meant she wound it, which meant this room was not simply shut up and forgotten. She used it. She kept it alive on purpose.\",\n        \"She dealt piquet with the soft precision of a woman who had been playing cards in rooms adjacent to the enemy for months, and did not once look up when the fire cracked, and the Green Room, for an hour at a time, was warm.\"\n      ],\n      opts:[ { t:\"Play on.\", go:'fuse' } ]\n    },\n\n    /* -------- the fuse -------- corrected: he's alone, playing patience,\n       when it blows \\u2014 a different evening from the piquet games with\n       Mme Tellier, not the same one.                                       */\n    fuse: {\n      art:'https://static.wixstatic.com/media/8e79ea_b22dbccb19264497bd586620ea58f69b~mv2.jpg', mark:'The fuse', label:'A later evening, alone',\n      text:[\n        \"Alone this time, laying out patience at the card table by the last of the daylight, he heard the click before he understood what it meant \\u2014 every electric light in the house dying at once, only the fire left burning.\",\n        \"Then footsteps, and not from upstairs. From the kitchen corridor. From the west wing. Whatever had happened, the Germans had heard it too.\",\n        \"He was halfway out of the chair when Mme Tellier came through the double doors from the Salon Bleu, crossed the room without breaking stride, took his arm, and walked him straight through into the Salon Bleu itself.\"\n      ],\n      opts:[ { t:\"Go where she takes you.\", go:'cupboard' } ]\n    },\n\n    /* -------- the cupboard, in the Salon Bleu -------- rebuilt entirely.\n       Not a calm counting exercise: a genuine flashback. The scar tissue\n       on both hands contracts on its own, the dark reads as the cockpit,\n       and when the latch finally moves, his fists are already up. The\n       real choice \\u2014 the only one the player gets \\u2014 is whether to let the\n       candle resolve who it is, or strike out blind.                      */\n    cupboard: {\n      keep:true, label:'The Salon Bleu, then the dark',\n      text:[\n        \"A cupboard beside the stove, barely deep enough to stand in. The latch caught, and the dark that came down was total, and his body did not know the difference between this dark and the other one \\u2014 the cockpit, the smoke, the canopy that would not open.\",\n        \"His hands closed into fists on their own, the burned scar tissue drawing tight the way it had in the fire and had never entirely let go of since. His breathing went fast and shallow, lungs checking for smoke that wasn't there. He pressed his back to the wall. The wall did not move. The cockpit had moved. This did not.\",\n        \"Footsteps went, and silence arrived in their place, and the silence was worse. She had put him here and left. She would come back, or she would not. Someone would open this door eventually. He did not know, yet, who.\"\n      ],\n      opts:[\n        { t:\"Hold. Let the light resolve who it is.\", go:'latch' },\n        { t:\"Strike \\u2014 now, before you can see.\", lose:'cupboard' }\n      ]\n    },\n\n    /* -------- the latch -------- */\n    latch: {\n      art:'https://static.wixstatic.com/media/8e79ea_f703d7c08ccc4897836cf5f67d84a825~mv2.jpg', mark:'The latch', label:'A candle in the doorway',\n      text:[\n        \"The latch moved, metal on metal, and a thin light came round the door before a face did \\u2014 a silhouette first, unreadable, could have been anyone, could have been Voigt. His fists were already up.\",\n        \"The candle caught her face before his arms decided anything. Mme Tellier. Entirely composed, as though the last ten minutes had cost her nothing whatsoever.\",\n        \"\\u2018Il est parti,\\u2019 she said. He's gone. Nothing else \\u2014 no account of the fuse, or the German at the barn door, or what it had taken to send both away in the same twelve minutes. An account was one more thing that could be repeated to the wrong person.\"\n      ],\n      opts:[ { t:\"Let your hands come down.\", go:'mirror' } ]\n    },\n\n    /* -------- the oak panel and the oval mirror -------- new: a single\n       quiet character beat on the first-floor landing, months into the\n       stay, seeing his own reflected face for the first time since the\n       fire, framed by carving from the same Austrian craftsman who did\n       the Green Room panelling at the abbey.                              */\n    mirror: {\n      art:'https://static.wixstatic.com/media/8e79ea_c782e1f24efe400c9d0cdf342fd0aa8a~mv2.jpg', mark:'The landing', label:'By the eighth week',\n      keep:true,\n      text:[\n        \"By the eighth week he could manage the turret stairs standing up, and Mme Tellier led him down one evening after the blackout was drawn. On the landing, a carved oak panel caught the last of the light \\u2014 garlands of oak leaves swagged heavy across the top, a confidence in the carving that felt like the same hand at work in a different register from the abbey's panelling. Set into the centre, an oval of glass.\"\n      ],\n      exam:{\n        cap:'Look.',\n        require:['face'],\n        spots:[\n          { k:'face', x:50, y:46, r:20, mono:'his own reflection', worth:0, text:[\n            \"His own face looked back at him. The scars. The hollows under the eyes. A man who had spent two months in an attic looking back at a man who no longer entirely recognised him.\",\n            \"Mme Tellier did not ask how long he stood there. She did not ask how he knew, either, that the same hand had carved this frame and the Green Room's panelling both. She simply waited, the way she waited for everything, until he was ready to go on.\"\n          ]}\n        ]\n      },\n      next:{ t:'Go on.', go:'stick' }\n    },\n\n    /* -------- the stick -------- ten weeks: the plaster comes off, the\n       crutches are retired, a walking stick takes their place.            */\n    stick: {\n      art:'https://static.wixstatic.com/media/8e79ea_e219d3d40d4c43489812b0d7ad7cf29c~mv2.jpg', mark:'The plaster comes off', label:'Ten weeks',\n      text:[\n        \"She cut the cast away with a saw from the woodshed and stood the walnut crutches against the wall. \\u2018You will not need these again,\\u2019 she said, and did not explain how she could be so sure, and was right anyway.\",\n        \"The leg beneath was pale and wasted thin, muscle he no longer recognised as his own. It buckled the first day. It held, shaking, on the second. By the end of the week he could cross the attic without stopping. By the second, he managed the turret stairs alone \\u2014 measured, one step at a time \\u2014 while she stood at the bottom with her arms folded, watching, and handed him a cup of ersatz coffee without comment when he reached the floor.\",\n        \"In place of the crutches, a stick, cut and stripped from the same walnut tree. Six paces, the length of the attic. Turn. Six paces back. The counting held. It always had.\"\n      ],\n      opts:[ { t:\"Let the weeks go on.\", go:'dinner' } ]\n    },\n\n    /* -------- Rachel and Jean's visit -------- new: the birthday dinner,\n       the reveal of \"Didi\", the Sagebien china, the Germans audible\n       through the boarded doors during the meal.                          */\n    dinner: {\n      art:'https://static.wixstatic.com/media/8e79ea_f66aec241ff141ceafb764b78f552e1d~mv2.jpg', mark:'The birthday', label:'The fourth of August',\n      text:[\n        \"Rachel's birthday. Her mother had roasted a haunch of roe deer G\u00e9rard brought down from the estate woodland, and the smell of it climbing the turret stairs was the first thing in ten weeks that hadn't smelled of plaster or carbolic or his own healing skin.\",\n        \"Rachel came for him herself at dusk, her hand steady on his arm down the thirty-five steps he now knew by feel, his own hand finding the bannister this time \\u2014 ten weeks earlier it could not have. Her husband Jean was already at the table. Four places. A cloth. China with a single blue monogram. Through the open doors to the Salon Bleu, faint, a gramophone and the clink of glasses \\u2014 the Abwehr, close enough to touch, on the other side of boarded wood.\",\n        \"As Jean cleared her plate he touched her shoulder. \\u2018Merci, Didi,\\u2019 he said \\u2014 a name that belonged to someone from before the war, before the widowhood, before any of this. She did not look up. Her hand covered his for a moment and did not move it away. Nobody at the table remarked on it. Everybody at the table understood exactly what they'd just been shown.\"\n      ],\n      opts:[ { t:\"Let the evening end.\", go:'departure' } ]\n    },\n\n    /* -------- departure -------- new: gloves, the stick, the parting.    */\n    departure: {\n      art:'https://static.wixstatic.com/media/8e79ea_b6daefbaed7940c49b55ee75be97bce8~mv2.jpg', mark:'The barn door', label:'Before first light',\n      text:[\n        \"She pressed a cloth bundle into his hands \\u2014 bread, hard cheese, a tin of sardines, a scrap of paper with a prayer copied out in her careful hand \\u2014 and then a pair of leather gloves, worn soft at the knuckles.\",\n        \"\\u2018Anselme's,\\u2019 she said, her husband's name, offered without ceremony the way she offered everything that mattered most. \\u2018Wear them. Your hands will get you arrested otherwise.\\u2019\",\n        \"The walnut stick went in his right hand. It would be, he understood already, the one thing he carried away from the Manoir besides the spark plug and the exercises and the memory of thirty-five steps taken in the dark, more than once, and never once alone.\"\n      ],\n      opts:[ { t:\"Go where the stick takes you.\", go:'END' } ]\n    }\n\n  };\n\n  var shownArt = null;\n\n  function loadArt(file, mark){\n    if(shownArt === file) return;\n    shownArt = file;\n    art.classList.remove('shown');\n    hmark.textContent = mark || '';\n    /* file may be a bare local filename (images/foo.jpg) or a full hosted\n       URL (e.g. Wix media) \u2014 only prefix with images/ for the former. */\n    var src = /^https?:\\/\\//.test(file) ? file : 'images/' + file;\n    hfile.textContent = src;\n    holder.classList.remove('gone');\n    var probe = new Image();\n    probe.onload = function(){\n      if(shownArt !== file) return;\n      art.src = probe.src;\n      art.classList.add('shown');\n      holder.classList.add('gone');\n    };\n    probe.src = src;\n  }\n\n  function paint(name){\n    var s = scenes[name];\n    if(!s) return;\n    currentScene = name;\n\n    if(!s.keep && s.art){ loadArt(s.art, s.mark); }\n\n    label.textContent = s.label || '';\n\n    prose.innerHTML = '';\n    (s.text || []).forEach(function(t){\n      var p = document.createElement('p');\n      p.innerHTML = t;\n      prose.appendChild(p);\n    });\n    if(s.said){\n      var q = document.createElement('p');\n      q.className = 'said';\n      q.textContent = s.said;\n      prose.appendChild(q);\n    }\n    (s.after || []).forEach(function(t){\n      var p = document.createElement('p');\n      p.innerHTML = t;\n      prose.appendChild(p);\n    });\n\n    prose.classList.remove('after-flash');\n    if(s.flash){\n      flash.classList.remove('go');\n      prose.classList.remove('after-flash');\n      void flash.offsetWidth;\n      flash.classList.add('go');\n      prose.classList.add('after-flash');\n    }\n\n    picks.innerHTML = '';\n\n    if(s.exam){ buildExam(s); }\n    else {\n      document.getElementById('exam').classList.remove('on');\n      script.classList.remove('through');\n      if(s.hold){ buildHold(s); }\n      else if(s.climb){ buildClimb(s); }\n      else if(s.flex){ buildFlex(s); }\n      else {\n        (s.opts || []).forEach(function(o){\n          if(o.need && !spent[o.need]) return;\n          if(o.key && spent[o.key]){\n            var d = document.createElement('button');\n            d.className = 'pick done';\n            d.type = 'button';\n            d.disabled = true;\n            d.textContent = o.t;\n            picks.appendChild(d);\n            return;\n          }\n          picks.appendChild(button(o.t, function(){\n            if(o.worth) steady += o.worth;\n            if(o.key) spent[o.key] = true;\n            if(o.lose){ lose(o.lose); return; }\n            if(o.go === 'END') finish(); else paint(o.go);\n          }));\n        });\n      }\n    }\n\n    script.scrollTop = 0;\n  }\n\n  function button(text, fn){\n    var b = document.createElement('button');\n    b.className = 'pick';\n    b.type = 'button';\n    b.textContent = text;\n    b.addEventListener('click', fn);\n    return b;\n  }\n\n  /* ---------- examine ----------\n     Attention is a lens. The frame is dimmed except where you are looking.\n     Hold your attention on something for a moment and it resolves.\n     Nothing here is a puzzle: you can leave whenever you like.            */\n\n  function buildExam(s){\n    var cfg  = s.exam;\n    var exam = document.getElementById('exam');\n    var ring = document.getElementById('ring');\n    var dwl  = document.getElementById('dwell');\n    var cap  = document.getElementById('examcap');\n\n    exam.querySelectorAll('.pin').forEach(function(p){ p.remove(); });\n    exam.classList.add('on');\n    script.classList.add('through');\n    cap.firstChild.textContent = cfg.cap || '';\n\n    var W = 0, H = 0;\n    function measure(){\n      var r = exam.getBoundingClientRect();\n      W = r.width; H = r.height;\n      return r;\n    }\n    measure();\n\n    var live = cfg.spots.filter(function(sp){ return !looked[sp.k]; });\n    var fieldArt = s.art;\n    var heldAt = 0;\n\n    /* a detail cut stays up while the passage is read, then the field returns */\n    function detail(sp){\n      if(sp.art){ loadArt(sp.art, sp.mono); heldAt = performance.now(); }\n      else { loadArt(fieldArt, s.mark); heldAt = 0; }\n    }\n    function backToField(){\n      if(shownArt !== fieldArt && heldAt && performance.now() - heldAt > 1400){\n        loadArt(fieldArt, s.mark);\n        heldAt = 0;\n      }\n    }\n\n    /* pins for anything already found on a previous visit */\n    cfg.spots.forEach(function(sp){\n      if(looked[sp.k]) addPin(sp, false);\n    });\n\n    function addPin(sp, faint){\n      var p = document.createElement('div');\n      p.className = 'pin' + (faint ? ' faint' : '');\n      p.style.left = sp.x + '%';\n      p.style.top  = sp.y + '%';\n      exam.appendChild(p);\n    }\n\n    var dwellOn = null, dwellStart = 0, raf = null, showing = null;\n\n    /* re-reading: hovering something already found brings its passage back */\n    function replay(sp){\n      if(showing === sp.k) return;\n      showing = sp.k;\n      detail(sp);\n      prose.innerHTML = '';\n      var head = document.createElement('p');\n      head.className = 'moved';\n      head.style.marginTop = '0';\n      head.textContent = sp.mono;\n      prose.appendChild(head);\n      (sp.text || []).forEach(function(tx){\n        var p = document.createElement('p');\n        p.innerHTML = tx;\n        prose.appendChild(p);\n      });\n      script.scrollTop = 0;\n    }\n\n    function moveTo(cx, cy){\n      var r = measure();\n      var mx = cx - r.left, my = cy - r.top;\n      exam.style.setProperty('--mx', mx + 'px');\n      exam.style.setProperty('--my', my + 'px');\n\n      backToField();\n\n      var px = mx / W * 100, py = my / H * 100;\n\n      /* already found and hovered again? show it again. */\n      for(var i = 0; i < cfg.spots.length; i++){\n        var f = cfg.spots[i];\n        if(!looked[f.k]) continue;\n        var fx = px - f.x, fy = py - f.y;\n        if(Math.sqrt(fx*fx + fy*fy) <= f.r){ replay(f); break; }\n      }\n\n      /* nearest unfound hotspot, in normalised units */\n      var near = null, nd = 1e9;\n      live.forEach(function(sp){\n        if(looked[sp.k]) return;\n        var dx = px - sp.x;\n        var dy = py - sp.y;\n        var d = Math.sqrt(dx*dx + dy*dy);\n        if(d < nd){ nd = d; near = sp; }\n      });\n\n      if(near){\n        var inside = nd <= near.r;\n        /* warmth from 0 at 3x radius to 1 at the edge */\n        var warm = Math.max(0, Math.min(1, 1 - (nd - near.r) / (near.r * 2)));\n        exam.style.setProperty('--ro', (0.16 + warm * 0.62).toFixed(3));\n        exam.style.setProperty('--rs', (1 - warm * 0.34).toFixed(3));\n        exam.style.setProperty('--rw', warm.toFixed(3));\n        ring.classList.toggle('hot', inside);\n\n        if(inside){\n          if(dwellOn !== near){ dwellOn = near; dwellStart = performance.now(); }\n        } else {\n          dwellOn = null;\n          exam.style.setProperty('--dwo', 0);\n          exam.style.setProperty('--dw', 0);\n        }\n      } else {\n        ring.classList.remove('hot');\n        exam.style.setProperty('--ro', .16);\n        exam.style.setProperty('--rs', 1);\n        exam.style.setProperty('--rw', 0);\n      }\n    }\n\n    function loop(t){\n      if(dwellOn){\n        var p = Math.min(1, (t - dwellStart) / 430);\n        exam.style.setProperty('--dwo', 1);\n        exam.style.setProperty('--dw', p.toFixed(3));\n        if(p >= 1){ found(dwellOn); }\n      }\n      raf = requestAnimationFrame(loop);\n    }\n    raf = requestAnimationFrame(loop);\n\n    function found(sp){\n      dwellOn = null;\n      exam.style.setProperty('--dwo', 0);\n      exam.style.setProperty('--dw', 0);\n      if(looked[sp.k]) return;\n      looked[sp.k] = true;\n      showing = sp.k;\n      detail(sp);\n      steady += (sp.worth || 0);\n      addPin(sp, false);\n\n      if(sp.flash){\n        flash.classList.remove('go');\n        void flash.offsetWidth;\n        flash.classList.add('go');\n      }\n\n      /* one assessment at a time \u2014 replace what was there rather than piling up */\n      prose.innerHTML = '';\n      var head = document.createElement('p');\n      head.className = 'moved';\n      head.style.marginTop = '0';\n      head.textContent = sp.mono;\n      prose.appendChild(head);\n      (sp.text || []).forEach(function(tx){\n        var p = document.createElement('p');\n        p.innerHTML = tx;\n        prose.appendChild(p);\n      });\n      script.scrollTop = 0;\n\n      live = cfg.spots.filter(function(x){ return !looked[x.k]; });\n      refresh();\n    }\n\n    /* pointer wiring */\n    function onMove(e){\n      if(e.touches && e.touches.length){ moveTo(e.touches[0].clientX, e.touches[0].clientY); }\n      else { moveTo(e.clientX, e.clientY); }\n    }\n    exam.addEventListener('mousemove', onMove);\n    exam.addEventListener('touchstart', function(e){ e.preventDefault(); onMove(e); }, {passive:false});\n    exam.addEventListener('touchmove',  function(e){ e.preventDefault(); onMove(e); }, {passive:false});\n    exam.addEventListener('mouseleave', function(){\n      exam.style.setProperty('--mx','-999px');\n      exam.style.setProperty('--my','-999px');\n      dwellOn = null;\n      exam.style.setProperty('--dwo', 0);\n    });\n\n    /* the proceed line, and the accessible way out */\n    var nameBtn = null;\n\n    function refresh(){\n      picks.innerHTML = '';\n\n      var need = cfg.require || [];\n      var outstanding = need.filter(function(k){ return !looked[k]; });\n\n      if(outstanding.length === 0){\n        picks.appendChild(button(s.next.t, function(){\n          teardown();\n          paint(s.next.go);\n        }));\n      } else {\n        /* he has not finished. no way onward yet. */\n        var wait = document.createElement('p');\n        wait.className = 'moved';\n        wait.style.marginTop = '.9rem';\n        wait.textContent = outstanding.length === 1\n          ? 'Keep assessing. One thing still unaccounted for.'\n          : 'Keep assessing. ' + outstanding.length\n            + ' things still unaccounted for.';\n        picks.appendChild(wait);\n      }\n\n      var total = cfg.spots.length;\n      var got   = cfg.spots.filter(function(x){ return looked[x.k]; }).length;\n\n      if(got < total){\n        nameBtn = document.createElement('button');\n        nameBtn.id = 'namebtn';\n        nameBtn.type = 'button';\n        nameBtn.textContent = 'Name what he can reach';\n        nameBtn.addEventListener('click', function(){\n          cfg.spots.forEach(function(sp){ if(!looked[sp.k]) addPin(sp, true); });\n          nameBtn.classList.remove('show');\n          nameBtn.disabled = true;\n        });\n        picks.appendChild(nameBtn);\n        setTimeout(function(){\n          if(nameBtn && !nameBtn.disabled) nameBtn.classList.add('show');\n        }, 15000);\n      }\n    }\n\n    function teardown(){\n      if(raf) cancelAnimationFrame(raf);\n      shownArt = null;\n      script.classList.remove('through');\n      exam.classList.remove('on');\n      exam.removeEventListener('mousemove', onMove);\n      exam.querySelectorAll('.pin').forEach(function(p){ p.remove(); });\n      exam.style.setProperty('--mx','-999px');\n      exam.style.setProperty('--my','-999px');\n    }\n\n    refresh();\n  }\n\n  /* ---------- the count ----------\n     Ten beats, kept steady. Let the rhythm go and his attention goes with it,\n     and the leg moves, and the stalks move. This is the counting motif that\n     Th\u00e9r\u00e8se will hand back to him at the abbey.                              */\n\n  /* ---------- the count ----------\n     Tap steadily to the number, then stop. Let the rhythm go and his attention\n     goes with it. Tap once past it and he has moved more than he meant to.\n     Either way the leg moves, and the stalks move with it.                   */\n\n  function buildHold(s){\n    var cfg    = (typeof s.hold === 'object') ? s.hold : {};\n    var GAP    = cfg.gap  || 620;   /* longest tolerable pause between beats */\n    var NEED   = cfg.need || 10;    /* beats required */\n    var SETTLE = cfg.settle || 900; /* stillness needed after the last beat */\n\n    var wrap = document.createElement('div');\n    wrap.id = 'hold';\n    wrap.tabIndex = 0;\n    wrap.setAttribute('role','button');\n    wrap.setAttribute('aria-label','Tap steadily to ' + NEED + ', then stop');\n    wrap.innerHTML =\n      '<div class=\"fill\"></div>' +\n      '<span class=\"cap\">' + (cfg.cap || 'Count \\u2014 then stop') + '</span>' +\n      '<span class=\"beat\"></span>';\n    picks.appendChild(wrap);\n    script.scrollTop = script.scrollHeight;\n\n    var fill = wrap.querySelector('.fill');\n    var beat = wrap.querySelector('.beat');\n    var count = 0, last = 0, watch = null, done = false, full = false;\n\n    function show(){\n      beat.textContent = count ? (count + ' / ' + NEED) : '';\n      fill.style.transform = 'scaleX(' + Math.min(count / NEED, 1) + ')';\n    }\n\n    function fail(msg, verdict){\n      if(done) return;\n      done = true;\n      if(watch){ clearTimeout(watch); watch = null; }\n      wrap.classList.remove('let');\n      if(!cfg.practice){\n        flash.classList.remove('go');\n        void flash.offsetWidth;\n        flash.classList.add('go');\n      }\n\n      var v = document.createElement('p');\n      v.className = 'verdict';\n      v.textContent = verdict;\n      prose.appendChild(v);\n\n      var n = document.createElement('p');\n      n.className = 'moved';\n      n.style.marginTop = '0';\n      n.textContent = msg;\n      prose.appendChild(n);\n      picks.innerHTML = '';\n      script.scrollTop = script.scrollHeight;\n\n      if(cfg.practice){\n        if(cfg.penalty){ steady = Math.max(0, steady - cfg.penalty); }\n        if(cfg.retry){\n          picks.appendChild(button('Try again.', function(){ paint(cfg.retry); }));\n        } else {\n          picks.appendChild(button('Continue.', function(){ paint(cfg.go || 'cup'); }));\n        }\n        return;\n      }\n      if(cfg.soft){\n        steady = Math.max(0, steady - (cfg.cost || 2));\n        picks.appendChild(button('Continue.', function(){ lose(cfg.lose || 'lift', verdict, true); }));\n        return;\n      }\n      picks.appendChild(button('Continue.', function(){ lose(cfg.lose || 'road', verdict); }));\n    }\n\n    function slow(){\n      var verdict = (count === 0)\n        ? 'You did not start the count'\n        : 'Too slow \\u2014 the count broke at ' + count + ' of ' + NEED;\n      fail(cfg.slowText || 'The count went ragged, and his attention went with it.', verdict);\n    }\n    function over(){\n      fail(cfg.overText || 'One more than he meant to. Nothing at all, and everything.',\n           'Too many \\u2014 one tap past ' + NEED);\n    }\n\n    function beatOnce(e){\n      if(e && e.cancelable) e.preventDefault();\n      if(done) return;\n\n      if(full){ over(); return; }\n\n      var now = performance.now();\n      if(count > 0 && now - last > GAP){ slow(); return; }\n      last = now;\n      count++;\n      wrap.classList.add('let');\n      show();\n\n      if(count >= NEED){\n        full = true;\n        if(watch){ clearTimeout(watch); watch = null; }\n        wrap.classList.add('brim');\n        watch = setTimeout(function(){\n          if(done) return;\n          done = true;\n          if(cfg.bonus){ steady += cfg.bonus; }\n          beat.textContent = '\\u00b7\\u00b7\\u00b7\\u00b7\\u00b7';\n          setTimeout(function(){ paint(cfg.go || 'stopped'); }, 500);\n        }, SETTLE);\n        return;\n      }\n\n      if(watch) clearTimeout(watch);\n      watch = setTimeout(slow, GAP);\n    }\n\n    wrap.addEventListener('mousedown', beatOnce);\n    wrap.addEventListener('touchstart', beatOnce, {passive:false});\n    wrap.addEventListener('keydown', function(e){\n      if(e.code === 'Space' || e.key === ' ' || e.key === 'Enter'){ beatOnce(e); }\n    });\n  }\n\n  /* ---------- the flex ----------\n     Press and hold. A bar climbs while the mouse (or finger) stays down.\n     Release too soon and the flex never finished. Release too late, past\n     the top, and it's held past where holding helped. Five reps, practice\n     mode throughout \\u2014 no capture, just a tally that colours the scene's\n     own ending text. Identical mechanic to chapter two's exercises, reused\n     deliberately: Mme Tellier picked up Th\\u00e9r\\u00e8se's method by watching, and\n     the game inherits it the same way.                                    */\n\n  function buildFlex(s){\n    var cfg    = (typeof s.flex === 'object') ? s.flex : {};\n    var REPS   = cfg.reps     || 5;\n    var FILL   = cfg.fillTime || 1300;\n    var WINDOW = cfg.window   || 350;\n\n    var wrap = document.createElement('div');\n    wrap.id = 'flex';\n    wrap.tabIndex = 0;\n    wrap.setAttribute('role','button');\n    wrap.setAttribute('aria-label','Press and hold, then release at the top');\n    wrap.innerHTML =\n      '<div class=\"fill\"></div>' +\n      '<span class=\"cap\">' + (cfg.cap || 'Press. Hold. Release right at the top.') + '</span>' +\n      '<span class=\"reps\">Rep 1 of ' + REPS + '</span>' +\n      '<span class=\"beat\"></span>';\n    picks.appendChild(wrap);\n    script.scrollTop = script.scrollHeight;\n\n    var fill = wrap.querySelector('.fill');\n    var repsEl = wrap.querySelector('.reps');\n    var beat = wrap.querySelector('.beat');\n\n    var rep = 0, good = 0, early = 0, late = 0;\n    var pressing = false, pressAt = 0, fullAt = 0, raf = null;\n    var lateFired = false, awaitingRelease = false, ended = false;\n\n    function repsText(){\n      repsEl.textContent = ended ? '' : 'Rep ' + Math.min(rep + 1, REPS) + ' of ' + REPS;\n    }\n    repsText();\n\n    function loop(){\n      if(pressing){\n        var t = performance.now() - pressAt;\n        if(t < FILL){\n          fill.style.transform = 'scaleX(' + (t / FILL) + ')';\n          wrap.classList.remove('window');\n        } else {\n          fill.style.transform = 'scaleX(1)';\n          if(!fullAt) fullAt = performance.now();\n          wrap.classList.add('window');\n          beat.textContent = 'Release.';\n          var since = performance.now() - fullAt;\n          if(since > WINDOW && !lateFired){\n            lateFired = true;\n            settleRep('late');\n          }\n        }\n      }\n      raf = requestAnimationFrame(loop);\n    }\n    raf = requestAnimationFrame(loop);\n\n    function resetBar(){\n      fill.style.transform = 'scaleX(0)';\n      wrap.classList.remove('window');\n      fullAt = 0; lateFired = false;\n    }\n\n    function settleRep(kind){\n      pressing = false;\n      if(kind === 'good'){ good++; beat.textContent = 'Held it.'; }\n      else if(kind === 'early'){ early++; beat.textContent = 'Too soon.'; }\n      else { late++; beat.textContent = 'Too long.'; }\n\n      rep++;\n      resetBar();\n\n      if(rep >= REPS){\n        finish();\n        return;\n      }\n      /* only 'late' fires while the mouse is still physically down (the\n         rAF loop catches it mid-hold) \\u2014 that's the one case where the\n         player needs to actually let go before the next press can start.\n         'early' and 'good' both fire from inside release() itself, which\n         means the mouse has already come up by the time we get here;\n         gating those too would silently swallow the player's very next\n         legitimate press.                                                */\n      if(kind === 'late'){ awaitingRelease = true; }\n      repsText();\n    }\n\n    function finish(){\n      ended = true;\n      wrap.remove();\n      var perfect = (good === REPS);\n      if(cfg.bonus && perfect){ steady += cfg.bonus; }\n      else if(cfg.penalty && good === 0){ steady = Math.max(0, steady - cfg.penalty); }\n\n      var line;\n      if(perfect) line = cfg.allGood || 'All five, clean.';\n      else if(good === 0) line = cfg.allBad || 'None of the five landed right.';\n      else line = (cfg.mixed || 'Some landed, some didn\\u2019t \\u2014 {good} of {reps} clean.')\n        .replace('{good}', good).replace('{reps}', REPS);\n\n      var n = document.createElement('p');\n      n.className = 'moved';\n      n.textContent = line;\n      prose.appendChild(n);\n      script.scrollTop = script.scrollHeight;\n\n      picks.innerHTML = '';\n      if(perfect || !cfg.retry){\n        picks.appendChild(button('Continue.', function(){ paint(cfg.go || 'cup'); }));\n      } else {\n        picks.appendChild(button('Try again.', function(){ paint(cfg.retry); }));\n      }\n    }\n\n    function press(e){\n      if(e.cancelable) e.preventDefault();\n      if(ended || pressing) return;\n      if(awaitingRelease) return;\n      pressing = true;\n      pressAt = performance.now();\n      fullAt = 0; lateFired = false;\n      beat.textContent = '';\n    }\n\n    function release(){\n      if(awaitingRelease){ awaitingRelease = false; return; }\n      if(ended || !pressing) return;\n      var t = performance.now() - pressAt;\n      if(t < FILL){ settleRep('early'); }\n      else if(!lateFired){ settleRep('good'); }\n    }\n\n    wrap.addEventListener('mousedown', press);\n    wrap.addEventListener('touchstart', press, {passive:false});\n    wrap.addEventListener('mouseup', release);\n    wrap.addEventListener('mouseleave', function(){ if(pressing) release(); });\n    wrap.addEventListener('touchend', release);\n    wrap.addEventListener('touchcancel', release);\n  }\n\n  /* ---------- the climb ----------\n     Weight, then clear, alternating, thirty-five times. No banister worth\n     gripping, so the hands are not the mechanic here \\u2014 the rhythm is. Wrong\n     rung or too slow either one costs a strike; three strikes and a door\n     opens below that should not have. A landing partway gives one line and no\n     safety \\u2014 the count does not reset.                                    */\n\n  function buildClimb(s){\n    var cfg    = (typeof s.climb === 'object') ? s.climb : {};\n    var STEPS  = cfg.steps || 35;\n    var GAP    = cfg.gap || 1100;\n    var MAX    = cfg.maxStrikes || 3;\n    var cue    = cfg.cue || { a:'Weight.', b:'Clear.' };\n    /* a general list of scripted narrative beats keyed to a step number,\n       e.g. [{at:7, text:'...'}, {at:16, text:'...'}] \\u2014 replaces the old\n       single hardcoded landing marker so a scene can script more than one\n       moment into an otherwise mechanical climb.                          */\n    var BEATS  = cfg.beats || (cfg.landing ? [{at:cfg.landing, text:cfg.landingText}] : []);\n    var firedBeats = {};\n\n    var wrap = document.createElement('div');\n    wrap.id = 'climb';\n    wrap.innerHTML =\n      '<span class=\"cap\">Alternate \\u2014 steady, no rushing</span>' +\n      '<div class=\"steprow\">Step <span class=\"n\">0</span> of ' + STEPS\n        + '<span class=\"strikes\"></span></div>' +\n      '<div class=\"cue\"></div>' +\n      '<button type=\"button\" class=\"rung\" data-side=\"a\"></button>' +\n      '<button type=\"button\" class=\"rung\" data-side=\"b\" style=\"margin-top:.5rem\"></button>';\n    picks.appendChild(wrap);\n    script.scrollTop = script.scrollHeight;\n\n    var stepEl    = wrap.querySelector('.n');\n    var strikesEl = wrap.querySelector('.strikes');\n    var cueEl     = wrap.querySelector('.cue');\n    var btnA      = wrap.querySelector('[data-side=\"a\"]');\n    var btnB      = wrap.querySelector('[data-side=\"b\"]');\n    btnA.textContent = cue.a;\n    btnB.textContent = cue.b;\n\n    var step = 0, strikes = 0, expect = 'a', last = performance.now();\n    var done = false, watch = null;\n\n    function paintStrikes(){\n      strikesEl.textContent = strikes ? ' ' + '\\u2715'.repeat(strikes) : '';\n    }\n    function cueNext(){\n      cueEl.textContent = (expect === 'a') ? cue.a : cue.b;\n    }\n    cueNext();\n\n    function armWatch(){\n      if(watch) clearTimeout(watch);\n      watch = setTimeout(function(){ strike('Too slow \\u2014 the rhythm broke on step ' + (step + 1) + '.'); }, GAP);\n    }\n    armWatch();\n\n    function strike(msg){\n      if(done) return;\n      strikes++;\n      paintStrikes();\n      if(strikes >= MAX){\n        done = true;\n        if(watch) clearTimeout(watch);\n        var v = document.createElement('p');\n        v.className = 'verdict';\n        v.textContent = 'Third strike \\u2014 step ' + (step + 1) + ' of ' + STEPS;\n        prose.appendChild(v);\n        var n = document.createElement('p');\n        n.className = 'moved';\n        n.style.marginTop = '0';\n        n.textContent = msg;\n        prose.appendChild(n);\n        picks.innerHTML = '';\n        script.scrollTop = script.scrollHeight;\n        picks.appendChild(button('Continue.', function(){\n          lose(cfg.lose || 'stairs', 'Third strike on the turret stairs');\n        }));\n        return;\n      }\n      var flashBtn = (expect === 'a') ? btnA : btnB;\n      flashBtn.classList.remove('wrong');\n      void flashBtn.offsetWidth;\n      flashBtn.classList.add('wrong');\n      last = performance.now();\n      armWatch();\n    }\n\n    function rung(side){\n      if(done) return;\n      if(side !== expect){ strike('The wrong leg, on a stair that does not forgive it.'); return; }\n      var now = performance.now();\n      last = now;\n      step++;\n      stepEl.textContent = step;\n      expect = (expect === 'a') ? 'b' : 'a';\n      cueNext();\n\n      BEATS.forEach(function(b){\n        if(!firedBeats[b.at] && step >= b.at){\n          firedBeats[b.at] = true;\n          var p = document.createElement('p');\n          p.className = 'moved';\n          p.textContent = b.text || '';\n          prose.appendChild(p);\n          script.scrollTop = script.scrollHeight;\n        }\n      });\n\n      if(step >= STEPS){\n        done = true;\n        if(watch) clearTimeout(watch);\n        picks.innerHTML = '';\n        setTimeout(function(){ paint(cfg.go || 'attic'); }, 400);\n        return;\n      }\n      armWatch();\n    }\n\n    btnA.addEventListener('click', function(){ rung('a'); });\n    btnB.addEventListener('click', function(){ rung('b'); });\n  }\n\n  /* ---------- capture ----------\n     He gives up nothing about himself \u2014 he knows nobody yet worth naming.\n     What capture costs here is Mme Tellier, who took him in before she knew\n     the first thing about him and has been paying for it every day since.  */\n\n  var LOSSES = {\n    stairs: {\n      head: 'The third strike.',\n      note: 'The rhythm broke on the stairs, weight and clear no longer meeting '\n          + 'in the dark, and a foot came down where the post should have been, '\n          + 'and the sound of it went down the turret like a dropped plate.',\n      cost: 'A search that finds a stranger on the stairs of a house eight '\n          + 'kilometres from a garrison does not stop at the stranger. Mme '\n          + 'Tellier answers for every night she did not report him, and for '\n          + 'every night before this one that nobody thought to ask about.',\n      foot: 'She knew what she was risking before he ever climbed the stairs.',\n      back: 'stairs'\n    },\n    cupboard: {\n      head: 'His fists came down first.',\n      note: 'The candle never got the chance to resolve anything. He had already '\n          + 'struck by the time the light caught her face \\u2014 a burned man\\u2019s fists, '\n          + 'thrown blind at a shape in a doorway, and the shape was the one '\n          + 'person in the house who had done nothing all evening but keep him alive.',\n      cost: 'A woman found injured in her own home has a great deal to explain, '\n          + 'and none of the explanations available to her leave the stranger she '\n          + 'was hiding out of the conversation. Mme Tellier pays for a moment '\n          + 'that was never actually hers to cause.',\n      foot: 'She had put herself between him and the door. She did not expect it to cost her the door itself.',\n      back: 'cupboard'\n    }\n  };\n\n  var loseBack = 'stairs';\n\n  function lose(key, verdict, onward){\n    var L = LOSSES[key] || LOSSES.stairs;\n    loseBack = L.back;\n    document.querySelector('#taken .eyebrow').textContent = verdict || 'Taken';\n    document.getElementById('retry').textContent = onward ? 'Go on' : 'Again';\n    document.querySelector('#taken h2').textContent = L.head;\n    document.getElementById('takennote').textContent = L.note;\n    document.getElementById('takencost').textContent = L.cost;\n    document.querySelector('#taken .foot').textContent = L.foot;\n    document.getElementById('taken').classList.remove('gone');\n  }\n\n  function taken(){ lose('stairs'); }\n\n  document.getElementById('retry').addEventListener('click', function(){\n    document.getElementById('taken').classList.add('gone');\n    paint(loseBack);\n  });\n\n  function finish(){\n    var note = \"No banister worth the name on the turret stairs, so he had climbed by rhythm instead of grip. No hands worth the name in the cupboard, so a held breath had done the work his fists could not. Ten weeks of a house measured out in counted things \\u2014 six paces, five flexions, thirty-five steps \\u2014 and at the end of it a stick in his hand that was, for the first time since Picardy, something he was holding rather than something holding him up.\";\n    document.getElementById('endnote').textContent = note;\n    closeC.classList.remove('gone');\n  }\n\n  document.getElementById('begin').addEventListener('click', function(){\n    openC.classList.add('gone');\n    paint('arrival');\n  });\n\n  document.getElementById('again').addEventListener('click', function(){\n    steady = 0; looked = {}; spent = {};\n    closeC.classList.add('gone');\n    paint('arrival');\n  });\n\n  /* ---------- save / resume ----------\n     Explicit save, not autosave \u2014 the player chooses the moment. Only the\n     scene name and the small state that shapes later text (steady, looked,\n     spent) are kept; nothing about an in-progress hold, flex, or climb is\n     preserved, so resuming always lands at the start of a scene, never\n     mid-mechanic.                                                          */\n\n  function doSave(){\n    try{\n      var data = { scene: currentScene, steady: steady, looked: looked, spent: spent };\n      localStorage.setItem(SAVE_KEY, JSON.stringify(data));\n      var btn = document.getElementById('savebtn');\n      var was = btn.textContent;\n      btn.textContent = 'Saved';\n      btn.disabled = true;\n      setTimeout(function(){ btn.textContent = was; btn.disabled = false; }, 1400);\n    }catch(e){ /* storage unavailable \u2014 fail quietly, saving just won't stick */ }\n  }\n\n  document.getElementById('savebtn').addEventListener('click', doSave);\n\n  (function checkForSave(){\n    try{\n      var raw = localStorage.getItem(SAVE_KEY);\n      if(!raw) return;\n      var data = JSON.parse(raw);\n      if(!data || !data.scene || !scenes[data.scene]) return;\n      var resumeBtn = document.getElementById('resume');\n      resumeBtn.classList.remove('gone');\n      resumeBtn.addEventListener('click', function(){\n        steady = data.steady || 0;\n        looked = data.looked || {};\n        spent  = data.spent  || {};\n        openC.classList.add('gone');\n        paint(data.scene);\n      });\n    }catch(e){ /* corrupt or unavailable save \u2014 just show Begin as normal */ }\n  })();\n\n  /* when bundled inside the combined teaser file, this chapter runs in its\n     own inner frame \u2014 \"next chapter\" can't just navigate to a URL that\n     doesn't exist in that context, so it asks the outer page to switch\n     instead. If this file is ever opened on its own (no parent frame),\n     the message simply goes nowhere and nothing breaks.                   */\n  var nextLink = document.getElementById('nextChapterLink');\n  if(nextLink){\n    nextLink.addEventListener('click', function(e){\n      e.preventDefault();\n      try{ window.parent.postMessage({ tpgGoTo: 1 }, '*'); }catch(err){}\n    });\n  }\n\n})();\n<\/script>\n</body>\n</html>\n";
  var CHAPTERS = { 1: CH1, 2: CH2, 3: CH3 };

  var frame = document.getElementById('game');

  function show(n){
    var html = CHAPTERS[n];
    if(!html) return;
    frame.srcdoc = html;
  }

  window.addEventListener('message', function(e){
    if(e && e.data && typeof e.data.tpgGoTo === 'number'){
      show(e.data.tpgGoTo);
      window.scrollTo(0, 0);
    }
  });

  show(1);
})();
</script>
