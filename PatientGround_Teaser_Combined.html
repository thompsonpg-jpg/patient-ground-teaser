s of an angle that should not exist.\"\n          ]},\n          { k:'sky', x:50, y:9, r:14, mono:'the sky', worth:1,\n            art:'https://static.wixstatic.com/media/8e79ea_500d6733d27d40d9a61d87dd69167114~mv2.jpg', text:[\n            \"Grey to the east, and a thin line of something that might have been pink along the horizon.\",\n            \"He had come down in the dark. He had been here hours, then, and nobody had come, and the farmer who must have watched the canopy open had gone back to his field.\"\n          ]}\n        ]\n      },\n      next:{ t:'Lie still and listen to the road.', go:'road' }\n    },\n\n    road: {\n      art:'https://static.wixstatic.com/media/8e79ea_548b203228ac46a7ab96ab00dd619a08~mv2.jpg', mark:'The road', label:'A few yards to his left',\n      text:[\n        \"He could hear the road. Close, a few yards to his left. Tyres on the paved surface, the engine note.\",\n        \"It was slowing.\",\n        \"He counted, because counting was something to do that was not moving, and because a man who is counting is not a man who is about to do something stupid with his one working leg.\"\n      ],\n      hold:{\n        need:10, gap:620, go:'stopped', lose:'road',\n        cap:'Count \\u2014 then stop',\n        slowText:'The count went ragged, and his attention went with it, and the leg moved, and the stalks moved with the leg.',\n        overText:'One past ten. A twitch, nothing, the smallest movement a man can make \\u2014 and the stalks moved with it.'\n      }\n    },\n\n    stopped: {\n      art:'https://static.wixstatic.com/media/8e79ea_1664d1d2f6de4694b3cad9a8eca752bb~mv2.jpg', mark:'Stopped', label:'A few yards to his left',\n      text:[\n        \"The engine stopped. A handbrake. A door.\",\n        \"Boots on the paved surface, then on the verge, then on the soft ground at the lip of the ditch. Four feet from his head, perhaps five. Close enough that he could hear the man breathing through his nose.\",\n        \"A grey car. He could see the wheel arch through the stalks and nothing else of it.\"\n      ],\n      opts:[ { t:\"Do not move.\", go:'nothing' } ]\n    },\n\n    nothing: {\n      keep:true, label:'A few yards to his left',\n      text:[\n        \"The man was relieving himself into the ditch.\",\n        \"That was all. He was a soldier on a long drive who had asked the driver to stop, and he finished, and he said something to someone in the car that David did not catch, and he got back in.\",\n        \"The doors closed. The handbrake. The engine.\",\n        \"The car drove on, and the sound of it thinned out along the road, and then there was nothing at all.\"\n      ],\n      opts:[ { t:\"Then birds.\", go:'bird' } ]\n    },\n\n    bird: {\n      art:'https://static.wixstatic.com/media/8e79ea_4ee9939c05dd440f98c010524624f4de~mv2.jpg', mark:'A blackbird', label:'The first thing',\n      text:[\n        \"A blackbird. The first thing he had heard that did not belong to the war.\",\n        \"The song was extravagant, absurdly beautiful, the bird performing for its own pleasure in a field where a man was lying broken in a ditch.\"\n      ],\n      opts:[\n        { t:\"Listen to it. Follow the phrases.\", go:'listened', worth:1 },\n        { t:\"Think about the leg.\", go:'thought', key:'thought' }\n      ]\n    },\n\n    listened: {\n      keep:true, label:'The first thing',\n      text:[\n        \"The notes were precise and improvised at the same time, a structure that allowed for variation, the same phrase repeated with small differences each time.\",\n        \"The listening was a relief because it was something to do that was not lying still and waiting and thinking about the leg and the hands.\"\n      ],\n      opts:[ { t:\"The sky was fully light now.\", go:'boy' } ]\n    },\n\n    thought: {\n      keep:true, label:'The first thing',\n      text:[\n        \"The pain had settled into a constant register he could bear if he did not move. Thinking about it did not help. It was simply where his attention went when he stopped choosing.\",\n        \"The bird went on singing. He had stopped hearing it, and then he noticed that he had stopped hearing it.\"\n      ],\n      opts:[ { t:\"Listen again.\", go:'bird' } ]\n    },\n\n    boy: {\n      art:'https://static.wixstatic.com/media/8e79ea_aeb6012c83994ba281cdb0cc7018d8cc~mv2.jpg', mark:'A boy', label:'The edge of the ditch',\n      text:[\n        \"A boy was looking at him.\",\n        \"Perhaps fifteen. Dark hair, cut short. His face was serious, a child who has found something he knows is important and is deciding what to do about it. He stood at the edge of the ditch with his weight on one foot as though he might at any moment decide this was not his concern and leave.\"\n      ],\n      opts:[\n        { t:\"Speak.\", go:'english', key:'english' },\n        { t:\"Try the French you have.\", go:'ask', need:'english' }\n      ]\n    },\n\n    english: {\n      keep:true, label:'The edge of the ditch',\n      text:[\n        \"It came out in English. Not a decision \\u2014 the words were simply there, the way they had been there every day of his life, and he heard them leave his mouth and could do nothing about it.\"\n      ],\n      said:\"\\u2018Please. I need help. Please, I\\u2019m hurt.\\u2019\",\n      after:[\n        \"The boy\\u2019s face did not move. Then it did. Not fear exactly, something more careful than fear, the look of someone who has just been handed a thing he did not ask for and cannot put down.\"\n      ],\n      opts:[ { t:\"Say something else. Anything.\", lose:'boy' } ]\n    },\n\n    ask: {\n      keep:true, label:'The edge of the ditch',\n      text:[ \"He tried again, and this time he reached for the French, and the French came out wrong \\u2014 schoolroom conjugations applied to a situation no classroom had prepared him for. It did not matter. It was the sound of the language that mattered, and that he had thought to use it.\" ],\n      said:\"\\u2018S\\u2019il vous pla\\u00eet. Aidez-moi.\\u2019\",\n      after:[\n        \"The boy considered him. His eyes moved from David\\u2019s face to the burned hands to the leg and back to the face. He did not speak. David could see him thinking \\u2014 not the thinking of a child weighing danger against curiosity, but the thinking of someone who had done this before, or who had been told what to do if this happened, and who was now checking the instructions against the reality.\",\n        \"\\u2018Vous \\u00eates anglais,\\u2019 the boy said. Not a question.\",\n        \"\\u2018Oui.\\u2019\"\n      ],\n      opts:[ { t:\"Wait.\", go:'bicycle' } ]\n    },\n\n    bicycle: {\n      art:'https://static.wixstatic.com/media/8e79ea_577ced4afa9c41438ba90d87150f5a62~mv2.jpg', mark:'The bicycle', label:'Attendez',\n      text:[\n        \"He leaned the bicycle more carefully against the tree, as though the bicycle\\u2019s safety mattered as much as anything else, and crouched beside the ditch.\",\n        \"He did not ask David\\u2019s name. Did not ask his rank or squadron. These were questions whose answers could be dangerous to know.\",\n        \"\\u2018Attendez,\\u2019 the boy said. Then he rode away down the lane, unhurried, a boy on a bicycle on a Tuesday morning.\"\n      ],\n      opts:[ { t:\"Wait.\", go:'waiting' } ]\n    },\n\n    waiting: {\n      keep:true, label:'The waiting',\n      text:[\n        \"The waiting was the worst. Not the pain. The worst was the not-knowing \\u2014 whether the boy would come back, whether he had gone to fetch help or gone to fetch Germans.\",\n        \"The intelligence officer at Hawkinge had given the standard lecture. <em>If you go down in occupied territory, trust no one.</em>\"\n      ],\n      opts:[\n        { t:\"Count. Something to do that is not thinking.\", go:'arrives', worth:1 },\n        { t:\"Work through what happens if it is Germans.\", go:'germans', key:'germans' }\n      ]\n    },\n\n    germans: {\n      keep:true, label:'The waiting',\n      text:[\n        \"If it was Germans, there was the leg, which meant he could not run. There were the hands, which meant he could not fight and could not climb and could not hold anything at all. There was the ditch, which was four feet deep and offered nothing.\",\n        \"He worked it through twice and arrived both times at the same place, which was that there was nothing at the end of the thinking, and that the thinking itself was the only part of it he could choose to stop.\"\n      ],\n      opts:[ { t:\"Stop.\", go:'waiting' } ]\n    },\n\n    arrives: {\n      art:'https://static.wixstatic.com/media/8e79ea_64de36bdf185484a94695dbdb7b36be7~mv2.jpg', mark:'The cart', label:'He came back',\n      text:[\n        \"A cart on the lane. The boy on the bench beside a man David had never seen, and the horse standing in its harness with its head down, and the whole of it so ordinary that for a moment he could not make it mean anything.\"\n      ],\n      opts:[ { t:\"Watch him climb down.\", go:'cart' } ]\n    },\n\n    cart: {\n      art:'https://static.wixstatic.com/media/8e79ea_53d48ba762da421ea1a0850ac0bb9318~mv2.jpg', mark:'He crouched', label:'He came back',\n      text:[\n        \"The boy came back. A cart this time, a man driving, heavy-set, in a dark coat and a cap pulled low.\",\n        \"He climbed down, and came to the edge, and crouched, and looked at David for a long moment without speaking.\"\n      ],\n      exam:{\n        cap:'Read him.',\n        require:['coat','collar','boy'],\n        spots:[\n          { k:'coat', x:52, y:78, r:13, mono:'the coat', worth:1, text:[\n            \"Not a farmer. The coat was wrong for a farmer \\u2014 too good, too dark, cut for a town and worn in a field.\",\n            \"Though the cap and the cart were right. Both exactly right, and the cap pulled low, and the effect of the whole was a man nobody on that road would look at twice.\",\n            \"Which was, David thought, probably the point.\"\n          ]},\n          { k:'collar', x:48, y:51, r:10, mono:'the throat', worth:1, text:[\n            \"He crossed himself. Quickly, the gesture small and practised, done before he seemed to know he had done it.\",\n            \"The hand went up past a band of something white at the throat, half hidden under the turned-up collar of the coat, and came down again, and David looked at the place where it had been and could not make it into anything.\",\n            \"Then the man crouched lower and studied the leg with the steady attention of someone who has seen worse.\"\n          ]},\n          { k:'boy', x:54, y:28, r:10, mono:'the boy', worth:1, text:[\n            \"The boy stood back and said nothing at all. He had fetched a man, and the man had come, and that was the whole of his part in it.\",\n            \"Nobody had asked David his name. Nobody was going to.\"\n          ]}\n        ]\n      },\n      next:{ t:'Let them.', go:'lift' }\n    },\n\n    lift: {\n      art:'https://static.wixstatic.com/media/8e79ea_3009096c37bd48279f50fa3fe0cc2dc9~mv2.jpg', mark:'The lift', label:'Without discussion',\n      text:[\n        \"He spoke to the boy in French, quietly. The boy nodded. They worked together without further discussion.\",\n        \"The boy held his shoulders. The man took the weight of the leg.\",\n        \"There was nothing to do about any of it except the one thing he had already found he could do.\"\n      ],\n      hold:{\n        need:14, gap:520, go:'carried', soft:true, cost:2, lose:'lift',\n        cap:'Count through it \\u2014 then stop',\n        slowText:'The count broke somewhere in the middle, and the pain came all the way up, and the next thing was straw and the sound of a wheel.',\n        overText:'He counted one past the end of it and heard himself make a sound he had not authorised.'\n      }\n    },\n\n    carried: {\n      art:'https://static.wixstatic.com/media/8e79ea_29cdeefb5b844197a48744cfa2e83e8f~mv2.jpg', mark:'Being carried', label:'The cart smelled of beets',\n      text:[\n        \"The cart moved slowly. David lay on his back and watched the French sky slide overhead. The man drove in silence. He had taken off his cap and his hair was grey and cut short.\",\n        \"The boy sat turned towards the rear, watching David with the attention of someone who has understood that the man in the straw is not safe yet and will not be safe for a long time.\"\n      ],\n      opts:[ { t:\"Let the sky slide past.\", go:'END' } ]\n    }\n\n  };\n\n  var shownArt = null;\n\n  function loadArt(file, mark){\n    if(shownArt === file) return;\n    shownArt = file;\n    art.classList.remove('shown');\n    hmark.textContent = mark || '';\n    /* file may be a bare local filename (images/foo.jpg) or a full hosted\n       URL (e.g. Wix media) \u2014 only prefix with images/ for the former. */\n    var src = /^https?:\\/\\//.test(file) ? file : 'images/' + file;\n    hfile.textContent = src;\n    holder.classList.remove('gone');\n    var probe = new Image();\n    probe.onload = function(){\n      if(shownArt !== file) return;\n      art.src = probe.src;\n      art.classList.add('shown');\n      holder.classList.add('gone');\n    };\n    probe.src = src;\n  }\n\n  function paint(name){\n    var s = scenes[name];\n    if(!s) return;\n    currentScene = name;\n\n    if(!s.keep && s.art){ loadArt(s.art, s.mark); }\n\n    label.textContent = s.label || '';\n\n    prose.innerHTML = '';\n    (s.text || []).forEach(function(t){\n      var p = document.createElement('p');\n      p.innerHTML = t;\n      prose.appendChild(p);\n    });\n    if(s.said){\n      var q = document.createElement('p');\n      q.className = 'said';\n      q.textContent = s.said;\n      prose.appendChild(q);\n    }\n    (s.after || []).forEach(function(t){\n      var p = document.createElement('p');\n      p.innerHTML = t;\n      prose.appendChild(p);\n    });\n\n    prose.classList.remove('after-flash');\n    if(s.flash){\n      flash.classList.remove('go');\n      prose.classList.remove('after-flash');\n      void flash.offsetWidth;\n      flash.classList.add('go');\n      prose.classList.add('after-flash');\n    }\n\n    picks.innerHTML = '';\n\n    if(s.exam){ buildExam(s); }\n    else {\n      document.getElementById('exam').classList.remove('on');\n      script.classList.remove('through');\n      if(s.hold){ buildHold(s); }\n      else {\n        (s.opts || []).forEach(function(o){\n          if(o.need && !spent[o.need]) return;\n          if(o.key && spent[o.key]){\n            var d = document.createElement('button');\n            d.className = 'pick done';\n            d.type = 'button';\n            d.disabled = true;\n            d.textContent = o.t;\n            picks.appendChild(d);\n            return;\n          }\n          picks.appendChild(button(o.t, function(){\n            if(o.worth) steady += o.worth;\n            if(o.key) spent[o.key] = true;\n            if(o.lose){ lose(o.lose); return; }\n            if(o.go === 'END') finish(); else paint(o.go);\n          }));\n        });\n          if(s.back){\n          picks.appendChild(button('Lie still.', function(){ paint('assess'); }));\n        }\n      }\n    }\n\n    script.scrollTop = 0;\n  }\n\n  function button(text, fn){\n    var b = document.createElement('button');\n    b.className = 'pick';\n    b.type = 'button';\n    b.textContent = text;\n    b.addEventListener('click', fn);\n    return b;\n  }\n\n  /* ---------- examine ----------\n     Attention is a lens. The frame is dimmed except where you are looking.\n     Hold your attention on something for a moment and it resolves.\n     Nothing here is a puzzle: you can leave whenever you like.            */\n\n  function buildExam(s){\n    var cfg  = s.exam;\n    var exam = document.getElementById('exam');\n    var ring = document.getElementById('ring');\n    var dwl  = document.getElementById('dwell');\n    var cap  = document.getElementById('examcap');\n\n    exam.querySelectorAll('.pin').forEach(function(p){ p.remove(); });\n    exam.classList.add('on');\n    script.classList.add('through');\n    cap.firstChild.textContent = cfg.cap || '';\n\n    var W = 0, H = 0;\n    function measure(){\n      var r = exam.getBoundingClientRect();\n      W = r.width; H = r.height;\n      return r;\n    }\n    measure();\n\n    var live = cfg.spots.filter(function(sp){ return !looked[sp.k]; });\n    var fieldArt = s.art;\n    var heldAt = 0;\n\n    /* a detail cut stays up while the passage is read, then the field returns */\n    function detail(sp){\n      if(sp.art){ loadArt(sp.art, sp.mono); heldAt = performance.now(); }\n      else { loadArt(fieldArt, s.mark); heldAt = 0; }\n    }\n    function backToField(){\n      if(shownArt !== fieldArt && heldAt && performance.now() - heldAt > 1400){\n        loadArt(fieldArt, s.mark);\n        heldAt = 0;\n      }\n    }\n\n    /* pins for anything already found on a previous visit */\n    cfg.spots.forEach(function(sp){\n      if(looked[sp.k]) addPin(sp, false);\n    });\n\n    function addPin(sp, faint){\n      var p = document.createElement('div');\n      p.className = 'pin' + (faint ? ' faint' : '');\n      p.style.left = sp.x + '%';\n      p.style.top  = sp.y + '%';\n      exam.appendChild(p);\n    }\n\n    var dwellOn = null, dwellStart = 0, raf = null, showing = null;\n\n    /* re-reading: hovering something already found brings its passage back */\n    function replay(sp){\n      if(showing === sp.k) return;\n      showing = sp.k;\n      detail(sp);\n      prose.innerHTML = '';\n      var head = document.createElement('p');\n      head.className = 'moved';\n      head.style.marginTop = '0';\n      head.textContent = sp.mono;\n      prose.appendChild(head);\n      (sp.text || []).forEach(function(tx){\n        var p = document.createElement('p');\n        p.innerHTML = tx;\n        prose.appendChild(p);\n      });\n      script.scrollTop = 0;\n    }\n\n    function moveTo(cx, cy){\n      var r = measure();\n      var mx = cx - r.left, my = cy - r.top;\n      exam.style.setProperty('--mx', mx + 'px');\n      exam.style.setProperty('--my', my + 'px');\n\n      backToField();\n\n      var px = mx / W * 100, py = my / H * 100;\n\n      /* already found and hovered again? show it again. */\n      for(var i = 0; i < cfg.spots.length; i++){\n        var f = cfg.spots[i];\n        if(!looked[f.k]) continue;\n        var fx = px - f.x, fy = py - f.y;\n        if(Math.sqrt(fx*fx + fy*fy) <= f.r){ replay(f); break; }\n      }\n\n      /* nearest unfound hotspot, in normalised units */\n      var near = null, nd = 1e9;\n      live.forEach(function(sp){\n        if(looked[sp.k]) return;\n        var dx = px - sp.x;\n        var dy = py - sp.y;\n        var d = Math.sqrt(dx*dx + dy*dy);\n        if(d < nd){ nd = d; near = sp; }\n      });\n\n      if(near){\n        var inside = nd <= near.r;\n        /* warmth from 0 at 3x radius to 1 at the edge */\n        var warm = Math.max(0, Math.min(1, 1 - (nd - near.r) / (near.r * 2)));\n        exam.style.setProperty('--ro', (0.16 + warm * 0.62).toFixed(3));\n        exam.style.setProperty('--rs', (1 - warm * 0.34).toFixed(3));\n        exam.style.setProperty('--rw', warm.toFixed(3));\n        ring.classList.toggle('hot', inside);\n\n        if(inside){\n          if(dwellOn !== near){ dwellOn = near; dwellStart = performance.now(); }\n        } else {\n          dwellOn = null;\n          exam.style.setProperty('--dwo', 0);\n          exam.style.setProperty('--dw', 0);\n        }\n      } else {\n        ring.classList.remove('hot');\n        exam.style.setProperty('--ro', .16);\n        exam.style.setProperty('--rs', 1);\n        exam.style.setProperty('--rw', 0);\n      }\n    }\n\n    function loop(t){\n      if(dwellOn){\n        var p = Math.min(1, (t - dwellStart) / 430);\n        exam.style.setProperty('--dwo', 1);\n        exam.style.setProperty('--dw', p.toFixed(3));\n        if(p >= 1){ found \n      var outstanding = need.filter(function(k){ return !looked[k]; });\n\n      if(outstanding.length === 0){\n        picks.appendChild(button(s.next.t, function(){\n          teardown();\n          paint(s.next.go);\n        }));\n      } else {\n        /* he has not finished. no way onward yet. */\n        var wait = document.createElement('p');\n        wait.className = 'moved';\n        wait.style.marginTop = '.9rem';\n        wait.textContent = outstanding.length === 1\n          ? 'Keep assessing. One thing still unaccounted for.'\n          : 'Keep assessing. ' + outstanding.length\n            + ' things still unaccounted for.';\n        picks.appendChild(wait);\n      }\n\n      var total = cfg.spots.length;\n      var got   = cfg.spots.filter(function(x){ return looked[x.k]; }).length;\n\n      if(got < total){\n        nameBtn = document.createElement('button');\n        nameBtn.id = 'namebtn';\n        nameBtn.type = 'button';\n        nameBtn.textContent = 'Name what he can reach';\n        nameBtn.addEventListener('click', function(){\n          cfg.spots.forEach(function(sp){ if(!looked[sp.k]) addPin(sp, true); });\n          nameBtn.classList.remove('show');\n          nameBtn.disabled = true;\n        });\n        picks.appendChild(nameBtn);\n        setTimeout(function(){\n          if(nameBtn && !nameBtn.disabled) nameBtn.classList.add('show');\n        }, 15000);\n      }\n    }\n\n    function teardown(){\n      if(raf) cancelAnimationFrame(raf);\n      shownArt = null;\n      script.classList.remove('through');\n      exam.classList.remove('on');\n      exam.removeEventListener('mousemove', onMove);\n      exam.querySelectorAll('.pin').forEach(function(p){ p.remove(); });\n      exam.style.setProperty('--mx','-999px');\n      exam.style.setProperty('--my','-999px');\n    }\n\n    refresh();\n  }\n\n  /* ---------- the count ----------\n     Ten beats, kept steady. Let the rhythm go and his attention goes with it,\n     and the leg moves, and the stalks move. This is the counting motif that\n     Th\u00e9r\u00e8se will hand back to him at the abbey.                              */\n\n  /* ---------- the count ----------\n     Tap steadily to the number, then stop. Let the rhythm go and his attention\n     goes with it. Tap once past it and he has moved more than he meant to.\n     Either way the leg moves, and the stalks move with it.                   */\n\n  function buildHold(s){\n    var cfg    = (typeof s.hold === 'object') ? s.hold : {};\n    var GAP    = cfg.gap  || 620;   /* longest tolerable pause between beats */\n    var NEED   = cfg.need || 10;    /* beats required */\n    var SETTLE = cfg.settle || 900; /* stillness needed after the last beat */\n\n    var wrap = document.createElement('div');\n    wrap.id = 'hold';\n    wrap.tabIndex = 0;\n    wrap.setAttribute('role','button');\n    wrap.setAttribute('aria-label','Tap steadily to ' + NEED + ', then stop');\n    wrap.innerHTML =\n      '<div class=\"fill\"></div>' +\n      '<span class=\"cap\">' + (cfg.cap || 'Count \\u2014 then stop') + '</span>' +\n      '<span class=\"beat\"></span>';\n    picks.appendChild(wrap);\n    script.scrollTop = script.scrollHeight;\n\n    var fill = wrap.querySelector('.fill');\n    var beat = wrap.querySelector('.beat');\n    var count = 0, last = 0, watch = null, done = false, full = false;\n\n    function show(){\n      beat.textContent = count ? (count + ' / ' + NEED) : '';\n      fill.style.transform = 'scaleX(' + Math.min(count / NEED, 1) + ')';\n    }\n\n    function fail(msg, verdict){\n      if(done) return;\n      done = true;\n      if(watch){ clearTimeout(watch); watch = null; }\n      wrap.classList.remove('let');\n      flash.classList.remove('go');\n      void flash.offsetWidth;\n      flash.classList.add('go');\n\n      var v = document.createElement('p');\n      v.className = 'verdict';\n      v.textContent = verdict;\n      prose.appendChild(v);\n\n      var n = document.createElement('p');\n      n.className = 'moved';\n      n.style.marginTop = '0';\n      n.textContent = msg;\n      prose.appendChild(n);\n      picks.innerHTML = '';\n      script.scrollTop = script.scrollHeight;\n\n      if(cfg.soft){\n        steady = Math.max(0, steady - (cfg.cost || 2));\n        setTimeout(function(){ lose(cfg.lose || 'lift', verdict, true); }, 1800);\n        return;\n      }\n      setTimeout(function(){ lose(cfg.lose || 'road', verdict); }, 1800);\n    }\n\n    function slow(){\n      var verdict = (count === 0)\n        ? 'You did not start the count'\n        : 'Too slow \\u2014 the count broke at ' + count + ' of ' + NEED;\n      fail(cfg.slowText || 'The count went ragged, and his attention went with it.', verdict);\n    }\n    function over(){\n      fail(cfg.overText || 'One more than he meant to. Nothing at all, and everything.',\n           'Too many \\u2014 one tap past ' + NEED);\n    }\n\n    function beatOnce(e){\n      if(e && e.cancelable) e.preventDefault();\n      if(done) return;\n\n      if(full){ over(); return; }\n\n      var now = performance.now();\n      if(count > 0 && now - last > GAP){ slow(); return; }\n      last = now;\n      count++;\n      wrap.classList.add('let');\n      show();\n\n      if(count >= NEED){\n        full = true;\n        if(watch){ clearTimeout(watch); watch = null; }\n        wrap.classList.add('brim');\n        watch = setTimeout(function(){\n          if(done) return;\n          done = true;\n          beat.textContent = '\\u00b7\\u00b7\\u00b7\\u00b7\\u00b7';\n          setTimeout(function(){ paint(cfg.go || 'stopped'); }, 500);\n        }, SETTLE);\n        return;\n      }\n\n      if(watch) clearTimeout(watch);\n      watch = setTimeout(slow, GAP);\n    }\n\n    wrap.addEventListener('mousedown', beatOnce);\n    wrap.addEventListener('touchstart', beatOnce, {passive:false});\n    wrap.addEventListener('keydown', function(e){\n      if(e.code === 'Space' || e.key === ' ' || e.key === 'Enter'){ beatOnce(e); }\n    });\n  }\n\n  /* ---------- capture ----------\n     He knows nobody and has been told nothing, so there is no network to lose.\n     What capture costs him is everything downstream of not moving.           */\n\n  var LOSSES = {\n    road: {\n      head: 'The stalks moved.',\n      note: 'He moved, and the leg moved with him, and the stalks moved with the '\n          + 'leg. The man at the lip of the ditch looked down. He was not a cruel '\n          + 'man and it made no difference at all.',\n      cost: 'The burns are dressed a fortnight later by people with no reason to '\n          + 'care whether his fingers ever close again. Nobody makes him flex them '\n          + 'five times a day, every day, and not stop. He sits out the war with '\n          + 'hands that healed wrong. And a boy at Longwood goes on waiting for a '\n          + 'spark plug from a Merlin engine.',\n      foot: 'Nobody else was taken. He had not been told anything yet.',\n      back: 'road'\n    },\n    lift: {\n      head: 'He went under.',\n      note: 'The count broke, and the pain came all the way up past the place '\n          + 'where he was holding it, and he heard himself make a sound he had '\n          + 'not authorised, and then there was nothing at all.',\n      cost: 'He comes to in straw with the sound of a wheel under him and no '\n          + 'memory of the lane or the turn onto it. Nothing is lost that anyone '\n          + 'could point to. But there will be mornings at the abbey when a woman '\n          + 'tells him to flex his fingers five times, and he will not be able to '\n          + 'make himself begin.',\n      foot: 'Nobody heard. He is still in the cart.',\n      back: 'carried'\n    },\n    boy: {\n      head: 'The boy did not come back.',\n      note: 'The English came out before he could stop it, the flat vowels of Kent '\n          + 'in a field in Picardy. The boy\\u2019s face closed. He took a step back, '\n          + 'and then another, and then he lifted the bicycle away from the tree '\n          + 'and rode off down the lane, and he did not look round.',\n      cost: 'Perhaps he told nobody. Perhaps he told someone and the wrong person '\n          + 'heard it first. Either way there is another night in the ditch, and '\n          + 'the cold does what the cold does, and no one at all comes down the '\n          + 'lane in the morning.',\n      foot: 'He was fifteen. He had brought her three of them already.',\n      back: 'boy'\n    }\n  };\n\n  var loseBack = 'road';\n\n  function lose(key, verdict, onward){\n    var L = LOSSES[key] || LOSSES.road;\n    loseBack = L.back;\n    document.querySelector('#taken .eyebrow').textContent = verdict || 'Taken';\n    document.getElementById('retry').textContent = onward ? 'Go on' : 'Again';\n    document.querySelector('#taken h2').textContent = L.head;\n    document.getElementById('takennote').textContent = L.note;\n    document.getElementById('takencost').textContent = L.cost;\n    document.querySelector('#taken .foot').textContent = L.foot;\n    document.getElementById('taken').classList.remove('gone');\n  }\n\n  function taken(){ lose('road'); }\n\n  document.getElementById('retry').addEventListener('click', function(){\n    document.getElementById('taken').classList.add('gone');\n    paint(loseBack);\n  });\n\n  function finish(){\n    var note;\n    if(steady >= 4){\n      note = \"He had paid attention to everything he could still reach \\u2014 the hands, the pocket, the bird, the counting. At the abbey a woman will tell him to flex his fingers five times a day, and he will already know how to hold to something small and repeat it.\";\n    } else if(steady >= 2){\n      note = \"He had held on to some of it. At the abbey a woman will tell him to flex his fingers five times a day, every day, and not to stop.\";\n    } else {\n      note = \"Mostly he had waited, and let his attention go where it wanted. At the abbey a woman will tell him to flex his fingers five times a day, every day, and not to stop. It will be harder than it sounds.\";\n    }\n    document.getElementById('endnote').textContent = note;\n    closeC.classList.remove('gone');\n  }\n\n  document.getElementById('begin').addEventListener('click', function(){\n    openC.classList.add('gone');\n    paint('waking');\n  });\n\n  document.getElementById('again').addEventListener('click', function(){\n    steady = 0; looked = {}; spent = {};\n    closeC.classList.add('gone');\n    paint('waking');\n  });\n\n  /* ---------- save / resume ----------\n     Explicit save, not autosave \u2014 the player chooses the moment. Only the\n     scene name and the small state that shapes later text (steady, looked,\n     spent) are kept; nothing about an in-progress hold or exam is\n     preserved, so resuming always lands at the start of a scene, never\n     mid-mechanic.                                                          */\n\n  function doSave(){\n    try{\n      var data = { scene: currentScene, steady: steady, looked: looked, spent: spent };\n      localStorage.setItem(SAVE_KEY, JSON.stringify(data));\n      var btn = document.getElementById('savebtn');\n      var was = btn.textContent;\n      btn.textContent = 'Saved';\n      btn.disabled = true;\n      setTimeout(function(){ btn.textContent = was; btn.disabled = false; }, 1400);\n    }catch(e){ /* storage unavailable \u2014 fail quietly, saving just won't stick */ }\n  }\n\n  document.getElementById('savebtn').addEventListener('click', doSave);\n\n  (function checkForSave(){\n    try{\n      var raw = localStorage.getItem(SAVE_KEY);\n      if(!raw) return;\n      var data = JSON.parse(raw);\n      if(!data || !data.scene || !scenes[data.scene]) return;\n      var resumeBtn = document.getElementById('resume');\n      resumeBtn.classList.remove('gone');\n      resumeBtn.addEventListener('click', function(){\n        steady = data.steady || 0;\n        looked = data.looked || {};\n        spent  = data.spent  || {};\n        openC.classList.add('gone');\n        paint(data.scene);\n      });\n    }catch(e){ /* corrupt or unavailable save \u2014 just show Begin as normal */ }\n  })();\n\n  /* when bundled inside the combined teaser file, this chapter runs in its\n     own inner frame \u2014 \"next chapter\" can't just navigate to a URL that\n     doesn't exist in that context, so it asks the outer page to switch\n     instead. If this file is ever opened on its own (no parent frame),\n     the message simply goes nowhere and nothing breaks.                   */\n  var nextLink = document.getElementById('nextChapterLink');\n  if(nextLink){\n    nextLink.addEventListener('click', function(e){\n      e.preventDefault();\n      try{ window.parent.postMessage({ tpgGoTo: 2 }, '*'); }catch(err){}\n    });\n  }\n\n})();\n<\/script>\n</body>\n</html>\n";
  var CH2 = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>The Patient Ground \u2014 Chapter Two</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#14161a;\n    --linen:#ded8cd;\n    --lichen:#949a90;\n    --dawn:#c4867f;\n    --hair:rgba(222,216,205,.18);\n  }\n\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n\n  body{\n    background:#0b0c0e;\n    color:var(--linen);\n    font-family:'EB Garamond',Georgia,serif;\n    -webkit-font-smoothing:antialiased;\n    display:flex;align-items:center;justify-content:center;\n    overflow:hidden;\n  }\n\n  /* a phone-shaped frame, 9:16, as large as the window allows.\n     the art fills it exactly, so portrait images are never cropped. */\n  #stage{\n    position:relative;\n    width:min(100vw, calc(100dvh * 9 / 16));\n    height:min(100dvh, calc(100vw * 16 / 9));\n    background:var(--ink);\n    overflow:hidden;\n  }\n\n  /* ---------- art ---------- */\n\n  #art{\n    position:absolute;inset:0;\n    width:100%;height:100%;\n    object-fit:cover;display:block;\n    opacity:0;transition:opacity 1.1s ease;\n  }\n  #art.shown{opacity:1}\n\n  #holder{\n    position:absolute;inset:0;\n    display:flex;flex-direction:column;\n    align-items:center;justify-content:center;\n    gap:.85rem;text-align:center;padding:1.5rem;\n    background:radial-gradient(120% 70% at 50% 22%, #3a3630 0%, #24221e 55%, #1a1815 100%);\n  }\n  #holder.gone{display:none}\n  #holder .mark{\n    font-family:'Courier Prime',monospace;\n    font-size:.62rem;letter-spacing:.24em;\n    text-transform:uppercase;color:var(--liche
